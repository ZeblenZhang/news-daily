<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日世界要闻</title>
<style>
  :root {
    /* BBC / ABC 风格配色 */
    --hot: #b80000;        /* 热点 - BBC 红 */
    --major: #1a3c6e;      /* 重大事件 - 深蓝 */
    --trend: #00684a;      /* 行业趋势 - 深绿 */
    --science: #7b1fa2;    /* 科学技术 - 紫 */
    --robotics: #0277bd;   /* 机器人AI - 蓝 */
    --finance: #c2185b;    /* 金融 - 玫红 */
    --digital: #e65100;    /* 数码电子 - 橙 */
    --industrial: #37474f; /* 工业制造 - 铁灰 */
    --construction: #8d6e63;/* 建筑施工 - 棕 */
    --other: #5d4037;      /* 其他 - 咖啡 */
    /* 基础 */
    --ink: #1a1a1a;
    --sub: #5f5f5f;
    --line: rgba(0,0,0,.12);
    --card: rgba(255,255,255,.92);
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* 背景图 + 毛玻璃遮罩 */
  .bg-layer {
    position: fixed; inset: 0; z-index: -2;
    background-size: cover; background-position: center;
    transition: background-image 1.2s ease;
  }
  .bg-veil {
    position: fixed; inset: 0; z-index: -1;
    background: rgba(255,255,255,.82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  body.night .bg-veil { background: rgba(8,12,24,.72); }
  body.night { color: #f2f2f2; }
  body.night .card { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.14); color: #f2f2f2; }
  body.night .source { color: rgba(255,255,255,.55); }
  body.night .summary { color: rgba(255,255,255,.72); }
  body.night .tab, body.night .sub-tab { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.16); color: #ddd; }
  body.night .brief, body.night .brand, body.night .date { color: rgba(255,255,255,.8); }

  .container { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  /* 头部 - 品牌条（BBC 式红色顶栏） */
  .topbar {
    height: 4px; background: var(--hot); margin-bottom: 0;
  }
  header { padding: 28px 0 18px; }
  .masthead {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 8px; margin-bottom: 8px;
  }
  .brand {
    font-size: 13px; letter-spacing: .28em; text-transform: uppercase;
    color: var(--sub); font-weight: 700;
  }
  body.night .brand { color: rgba(255,255,255,.75); }
  .date { font-size: 13px; color: var(--sub); }
  h1 {
    font-size: 32px; font-weight: 800; letter-spacing: -.5px; line-height: 1.15;
    margin-bottom: 10px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
  }
  .brief {
    font-size: 14px; color: var(--sub); max-width: 760px;
    border-left: 4px solid var(--hot); padding-left: 14px;
  }

  /* 标签导航 */
  .tabs {
    display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 14px;
    position: sticky; top: 0; padding: 10px 0; z-index: 10;
    background: transparent;
  }
  .tab {
    border: 1px solid var(--line); background: var(--card); color: var(--sub);
    padding: 7px 16px; border-radius: 4px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .18s ease; user-select: none;
  }
  .tab:hover { color: var(--ink); border-color: #999; }
  body.night .tab:hover { color: #fff; border-color: #bbb; }
  .tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  body.night .tab.active { background: #fff; color: #111; border-color: #fff; }
  .tab .count { font-size: 11px; opacity: .6; margin-left: 4px; }

  /* 子分类导航 */
  .sub-tabs { display: none; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
  .sub-tabs.show { display: flex; }
  .sub-tab {
    border: 1px solid var(--line); background: var(--card); color: var(--sub);
    padding: 5px 13px; border-radius: 4px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all .15s ease; user-select: none;
  }
  .sub-tab:hover { color: var(--ink); border-color: #999; }
  body.night .sub-tab:hover { color: #fff; border-color: #bbb; }
  .sub-tab.active { background: var(--trend); color: #fff; border-color: var(--trend); }

  /* 新闻列表 */
  .list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 60px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 15px; display: block; text-decoration: none; color: inherit;
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    border-left: 4px solid transparent;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.08); }
  body.night .card:hover { box-shadow: 0 8px 22px rgba(0,0,0,.4); }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .tag {
    font-size: 10px; padding: 2px 8px; border-radius: 3px; font-weight: 700;
    letter-spacing: .02em; white-space: nowrap; color: #fff;
  }
  /* 大类标签色 */
  .tag.hot   { background: var(--hot); }
  .tag.major { background: var(--major); }
  .tag.trend { background: var(--trend); }
  /* 子分类标签色（BBC/ABC 分区色） */
  .tag.sub-science      { background: var(--science); }
  .tag.sub-robotics     { background: var(--robotics); }
  .tag.sub-finance      { background: var(--finance); }
  .tag.sub-digital      { background: var(--digital); }
  .tag.sub-industrial   { background: var(--industrial); }
  .tag.sub-construction { background: var(--construction); }
  .tag.sub-other        { background: var(--other); }
  /* 卡片左侧色条 */
  .card.cat-hot { border-left-color: var(--hot); }
  .card.cat-major { border-left-color: var(--major); }
  .card.cat-trend { border-left-color: var(--trend); }
  .source { font-size: 11px; color: #aaa; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card h2 {
    font-size: 15px; font-weight: 600; line-height: 1.4; margin-bottom: 4px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .summary {
    font-size: 12.5px; color: var(--sub); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* 英文原文 */
  .card .en {
    font-size: 11.5px; color: #999; font-style: italic; margin-top: 5px;
    line-height: 1.4; padding-top: 5px; border-top: 1px dashed rgba(0,0,0,.12);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  body.night .card .en { color: rgba(255,255,255,.55); border-top-color: rgba(255,255,255,.16); }
  .empty { text-align: center; color: var(--sub); padding: 60px 0; grid-column: 1 / -1; }

  footer { text-align: center; color: #aaa; font-size: 12px; padding: 28px 0 44px; }
  footer a { color: #999; text-decoration: none; }
  body.night footer, body.night footer a { color: rgba(255,255,255,.5); }

  @media (max-width: 700px) { .list { grid-template-columns: 1fr; } }
  @media (max-width: 600px) { h1 { font-size: 26px; } .card { padding: 12px 14px; } }
</style>
</head>
<body>
<div class="bg-layer" id="bgLayer"></div>
<div class="bg-veil"></div>

<div class="topbar"></div>
<div class="container">
  <header>
    <div class="masthead">
      <span class="brand">DAILY BRIEFING</span>
      <span class="date" id="dateLabel"></span>
    </div>
    <h1>今日世界要闻</h1>
    <p class="brief" id="brief"></p>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <nav class="sub-tabs" id="subTabs"></nav>
  <main class="list" id="list"></main>

  <footer>
    数据由脚本每日自动抓取 · 内容版权归原媒体所有 · <a href="#" id="genInfo"></a>
  </footer>
</div>

<script>
  // 数据由 build.py 注入
  var NEWS_DATA = __DATA__;

  var CAT_LABEL = NEWS_DATA.categories || { hot: "热点", major: "重大事件", trend: "行业趋势" };
  var ORDER = ["major", "hot", "trend"];

  var SUB_LABEL = NEWS_DATA.trend_subcategories || {
    science: "科学技术", robotics: "机器人AI", finance: "金融", digital: "数码电子",
    industrial: "工业制造", construction: "建筑施工", other: "其他"
  };
  var SUB_ORDER = NEWS_DATA.trend_subcategory_order ||
    ["science", "robotics", "finance", "digital", "industrial", "construction", "other"];

  /* ============ 背景图：白天自然风光 / 夜晚宇宙星空 ============ */
  var BGS = NEWS_DATA.backgrounds || { day: [], night: [] };

  function pickBackground() {
    var h = new Date().getHours();
    var isNight = (h >= 18 || h < 6);  // 18:00 - 次日 06:00 为夜晚
    var pool = isNight ? (BGS.night.length ? BGS.night : BGS.day) : (BGS.day.length ? BGS.day : BGS.night);
    if (!pool.length) return;
    var idx = Math.floor(Math.random() * pool.length);
    document.getElementById("bgLayer").style.backgroundImage = 'url("' + pool[idx] + '")';
    document.body.classList.toggle("night", isNight);
  }

  function startBackgroundTimer() {
    pickBackground();
    // 每小时检查一次是否切换昼夜；每 5 分钟轮换一张同类别背景
    setInterval(pickBackground, 5 * 60 * 1000);
  }

  document.getElementById("dateLabel").textContent =
    (NEWS_DATA.date_cn || "") + " " + (NEWS_DATA.weekday || "");
  document.getElementById("brief").textContent = NEWS_DATA.brief ||
    "以下为今日热点、重大事件与行业趋势精选，点击标题可跳转原文阅读全文。";
  document.getElementById("genInfo").textContent =
    "更新于 " + (NEWS_DATA.generated_at || "");

  // 统计各分类数量
  var counts = { all: NEWS_DATA.items.length };
  NEWS_DATA.items.forEach(function(it) { counts[it.category] = (counts[it.category] || 0) + 1; });

  var tabs = [ { key: "all", label: "全部" } ].concat(
    ORDER.map(function(k) { return { key: k, label: CAT_LABEL[k] || k }; })
  );

  var tabsEl = document.getElementById("tabs");
  tabs.forEach(function(t) {
    var b = document.createElement("button");
    b.className = "tab" + (t.key === "all" ? " active" : "");
    b.dataset.key = t.key;
    b.innerHTML = t.label + '<span class="count">' + (counts[t.key] || 0) + "</span>";
    b.onclick = function() { setMainTab(t.key); };
    tabsEl.appendChild(b);
  });

  var subTabsEl = document.getElementById("subTabs");
  SUB_ORDER.forEach(function(key) {
    var b = document.createElement("button");
    b.className = "sub-tab" + (key === "all" ? " active" : "");
    b.dataset.sub = key;
    b.textContent = SUB_LABEL[key] || key;
    b.onclick = function() { setSubTab(key); };
    subTabsEl.appendChild(b);
  });

  var listEl = document.getElementById("list");
  var curMain = "all";
  var curSub = "all";

  function setMainTab(key) {
    curMain = key;
    curSub = "all";
    var btns = tabsEl.querySelectorAll(".tab");
    btns.forEach(function(b) { b.classList.toggle("active", b.dataset.key === key); });
    subTabsEl.classList.toggle("show", key === "trend");
    if (key === "trend") {
      subTabsEl.querySelectorAll(".sub-tab").forEach(function(s) {
        s.classList.toggle("active", s.dataset.sub === "all");
      });
    }
    render();
  }

  function setSubTab(sub) {
    curSub = sub;
    subTabsEl.querySelectorAll(".sub-tab").forEach(function(s) {
      s.classList.toggle("active", s.dataset.sub === sub);
    });
    render();
  }

  function render() {
    var items = NEWS_DATA.items.filter(function(it) {
      if (curMain !== "all" && it.category !== curMain) return false;
      if (curMain === "trend" && curSub !== "all" && (it.subcategory || "other") !== curSub) return false;
      return true;
    });

    if (!items.length) {
      listEl.innerHTML = '<div class="empty">暂无内容</div>';
      return;
    }

    listEl.innerHTML = items.map(function(it) {
      var label = CAT_LABEL[it.category] || it.category;
      var sub = it.category === "trend" ? (it.subcategory || "other") : null;
      var subLabel = sub
        ? '<span class="tag sub-' + sub + '">' + (SUB_LABEL[sub] || "其他") + "</span>" : "";
      // 英文原文展示（国外源）
      var enHtml = "";
      if (it.lang === "en" && it.title_en) {
        enHtml = '<p class="en">' + escapeHtml(it.title_en) + "</p>";
      }
      return (
        '<a class="card cat-' + it.category + '" href="' + it.url + '" target="_blank" rel="noopener noreferrer">' +
          '<div class="card-top">' +
            '<span class="tag ' + it.category + '">' + label + "</span>" +
            subLabel +
            '<span class="source">' + (it.source || "") + "</span>" +
          "</div>" +
          "<h2>" + escapeHtml(it.title) + "</h2>" +
          (it.summary ? '<p class="summary">' + escapeHtml(it.summary) + "</p>" : "") +
          enHtml +
        "</a>"
      );
    }).join("");
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  render();
  startBackgroundTimer();
</script>
</body>
</html>
