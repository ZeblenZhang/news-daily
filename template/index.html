<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日世界要闻</title>
<style>
  :root {
    --bg: #faf9f7;
    --card: #ffffff;
    --ink: #1a1a1a;
    --sub: #6b6b6b;
    --line: #e9e6e1;
    --accent: #b7410e;
    --hot: #c0392b;
    --major: #1a5276;
    --trend: #1e7a4f;
    --chip-bg: #f1efe9;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  /* 头部 */
  header { padding: 34px 0 20px; }
  .masthead {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 8px; margin-bottom: 8px;
  }
  .brand { font-size: 13px; letter-spacing: .28em; color: var(--sub); text-transform: uppercase; }
  .date { font-size: 13px; color: var(--sub); }
  h1 {
    font-size: 30px; font-weight: 700; letter-spacing: -.5px; line-height: 1.2;
    margin-bottom: 10px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
  }
  .brief {
    font-size: 14px; color: var(--sub); max-width: 720px;
    border-left: 3px solid var(--accent); padding-left: 14px;
  }

  /* 标签导航 */
  .tabs {
    display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0 16px;
    position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 10;
  }
  .tab {
    border: 1px solid var(--line); background: var(--card); color: var(--sub);
    padding: 6px 16px; border-radius: 999px; font-size: 13px; cursor: pointer;
    transition: all .18s ease; user-select: none;
  }
  .tab:hover { border-color: #c9c4bd; color: var(--ink); }
  .tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tab .count { font-size: 11px; opacity: .6; margin-left: 4px; }

  /* 子分类导航（行业趋势内） */
  .sub-tabs {
    display: none; gap: 6px; flex-wrap: wrap; margin: 0 0 14px;
  }
  .sub-tabs.show { display: flex; }
  .sub-tab {
    border: 1px solid var(--line); background: var(--card); color: var(--sub);
    padding: 4px 12px; border-radius: 999px; font-size: 12px; cursor: pointer;
    transition: all .15s ease; user-select: none;
  }
  .sub-tab:hover { border-color: #c9c4bd; color: var(--ink); }
  .sub-tab.active { background: var(--trend); color: #fff; border-color: var(--trend); }

  /* 新闻列表：紧凑卡片，多列网格 */
  .list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 60px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 15px; display: block; text-decoration: none; color: inherit;
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .card:hover {
    transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.06);
    border-color: #d8d3cb;
  }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .tag {
    font-size: 10px; padding: 2px 8px; border-radius: 5px; font-weight: 600;
    letter-spacing: .02em; white-space: nowrap;
  }
  .tag.hot   { background: #fbe9e7; color: var(--hot); }
  .tag.major { background: #e8f0f7; color: var(--major); }
  .tag.trend { background: #e6f4ec; color: var(--trend); }
  .tag.sub   { background: var(--chip-bg); color: var(--sub); }
  .source { font-size: 11px; color: #aaa; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card h2 {
    font-size: 15px; font-weight: 600; line-height: 1.4; margin-bottom: 4px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .summary {
    font-size: 12.5px; color: var(--sub); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .empty { text-align: center; color: var(--sub); padding: 60px 0; grid-column: 1 / -1; }

  footer {
    text-align: center; color: #aaa; font-size: 12px; padding: 28px 0 44px;
  }
  footer a { color: #999; text-decoration: none; }

  @media (max-width: 700px) {
    .list { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    h1 { font-size: 26px; }
    .card { padding: 12px 14px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="masthead">
      <span class="brand">DAILY BRIEFING</span>
      <span class="date" id="dateLabel"></span>
    </div>
    <h1>今日世界要闻</h1>
    <p class="brief" id="brief"></p>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <nav class="sub-tabs" id="subTabs"></nav>

  <main class="list" id="list"></main>

  <footer>
    数据由脚本每日自动抓取 · 内容版权归原媒体所有 · <a href="#" id="genInfo"></a>
  </footer>
</div>

<script>
  // 数据由 build.py 注入
  var NEWS_DATA = __DATA__;

  var CAT_LABEL = NEWS_DATA.categories || { hot: "热点", major: "重大事件", trend: "行业趋势" };
  var ORDER = ["major", "hot", "trend"];

  // 行业趋势子分类
  var SUB_LABEL = NEWS_DATA.trend_subcategories || {
    science: "科学技术", robotics: "机器人AI", digital: "数码电子",
    industrial: "工业制造", construction: "建筑施工", other: "其他"
  };
  var SUB_ORDER = NEWS_DATA.trend_subcategory_order ||
    ["science", "robotics", "digital", "industrial", "construction", "other"];

  document.getElementById("dateLabel").textContent =
    (NEWS_DATA.date_cn || "") + " " + (NEWS_DATA.weekday || "");

  document.getElementById("brief").textContent = NEWS_DATA.brief ||
    "以下为今日热点、重大事件与行业趋势精选，点击标题可跳转原文阅读全文。";

  document.getElementById("genInfo").textContent =
    "更新于 " + (NEWS_DATA.generated_at || "");

  // 统计各分类数量
  var counts = { all: NEWS_DATA.items.length };
  NEWS_DATA.items.forEach(function(it) { counts[it.category] = (counts[it.category] || 0) + 1; });

  var tabs = [ { key: "all", label: "全部" } ].concat(
    ORDER.map(function(k) { return { key: k, label: CAT_LABEL[k] || k }; })
  );

  var tabsEl = document.getElementById("tabs");
  tabs.forEach(function(t) {
    var b = document.createElement("button");
    b.className = "tab" + (t.key === "all" ? " active" : "");
    b.dataset.key = t.key;
    b.innerHTML = t.label + '<span class="count">' + (counts[t.key] || 0) + "</span>";
    b.onclick = function() { setMainTab(t.key); };
    tabsEl.appendChild(b);
  });

  // 构建子分类导航（仅行业趋势下显示）
  var subTabsEl = document.getElementById("subTabs");
  SUB_ORDER.forEach(function(key) {
    var b = document.createElement("button");
    b.className = "sub-tab" + (key === "all" ? " active" : "");
    b.dataset.sub = key;
    b.textContent = SUB_LABEL[key] || key;
    b.onclick = function() { setSubTab(key); };
    subTabsEl.appendChild(b);
  });

  var listEl = document.getElementById("list");
  var curMain = "all";   // 当前主分类
  var curSub = "all";    // 当前子分类（all = 全部）

  function setMainTab(key) {
    curMain = key;
    curSub = "all";
    var btns = tabsEl.querySelectorAll(".tab");
    btns.forEach(function(b) { b.classList.toggle("active", b.dataset.key === key); });
    // 只有行业趋势才显示子分类栏
    subTabsEl.classList.toggle("show", key === "trend");
    if (key === "trend") {
      var subs = subTabsEl.querySelectorAll(".sub-tab");
      subs.forEach(function(s) { s.classList.toggle("active", s.dataset.sub === "all"); });
    }
    render();
  }

  function setSubTab(sub) {
    curSub = sub;
    var subs = subTabsEl.querySelectorAll(".sub-tab");
    subs.forEach(function(s) { s.classList.toggle("active", s.dataset.sub === sub); });
    render();
  }

  function render() {
    var items = NEWS_DATA.items.filter(function(it) {
      if (curMain !== "all" && it.category !== curMain) return false;
      if (curMain === "trend" && curSub !== "all" && (it.subcategory || "other") !== curSub) return false;
      return true;
    });

    if (!items.length) {
      listEl.innerHTML = '<div class="empty">暂无内容</div>';
      return;
    }

    listEl.innerHTML = items.map(function(it) {
      var label = CAT_LABEL[it.category] || it.category;
      var subLabel = (it.category === "trend" && it.subcategory)
        ? '<span class="tag sub">' + (SUB_LABEL[it.subcategory] || "其他") + "</span>" : "";
      return (
        '<a class="card" href="' + it.url + '" target="_blank" rel="noopener noreferrer">' +
          '<div class="card-top">' +
            '<span class="tag ' + it.category + '">' + label + "</span>" +
            subLabel +
            '<span class="source">' + (it.source || "") + "</span>" +
          "</div>" +
          "<h2>" + escapeHtml(it.title) + "</h2>" +
          (it.summary ? '<p class="summary">' + escapeHtml(it.summary) + "</p>" : "") +
        "</a>"
      );
    }).join("");
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  render();
</script>
</body>
</html>
