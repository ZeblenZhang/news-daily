name: Daily News Update

on:
  push:
    branches: [ main ]
    paths:
      - "scraper/**"
      - "template/**"
      - "build.py"
      - "index.html"
      - "data/**"
      - ".github/workflows/**"
  schedule:
    # UTC 00:30 = 北京时间 08:30（早间刷新）
    - cron: "30 0 * * *"
    # UTC 12:30 = 北京时间 20:30（晚间刷新）
    - cron: "30 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Build page
        run: python build.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
