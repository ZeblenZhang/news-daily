ool-using heavy industrial humanoid has plenty of future applications, many of which can be expanded from the welding skill even within shipyards. “Shipbuilding is a great beachhead,” Pratt says. “There are tons of adjacent markets, like grinding, painting, and other kinds of fabrication.” Persona’s ambition, Radford adds, is to be “the largest repository of industrial skills.” It’s going to take time to get there. That time will be needed to collect tens of thousands of hours of expert demonstration data, create high-fidelity simulations, and conduct real-world testing. And however promising Persona’s approach may seem, the company still has to prove that its idea for an economically viable robotics company can be realized. It’s the same challenge that every humanoid robot company is facing. “A lot of the technical problems are the same no matter whether you’re in a house or a shipyard,” Pratt says. “Everybody’s got a great team and smart people, and we’re all knocking these problems out together.”", "subcategory": "industrial"}, {"title": "Video Friday: Lift Happens", "url": "https://spectrum.ieee.org/video-friday-darpa-heavy-lift-challenge", "summary": "Video Friday is your weekly selection of awesome robotics videos, collected by your friends at IEEE Spectrum robotics. We also post a weekly calendar of upcomin…", "source": "IEEE Spectrum", "category": "trend", "lang": "en", "title_en": "Video Friday: Lift Happens", "summary_en": "Video Friday is your weekly selection of awesome robotics videos, collected by your friends at IEEE Spectrum robotics. We also post a weekly calendar of upcomin…", "content_en": "Video Friday is your weekly selection of awesome robotics videos, collected by your friends at IEEE Spectrum robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please send us your events for inclusion.Actuate 2026: 18–19 August 2026, SAN FRANCISCOIROS 2026: 27 September–1 October 2026, PITTSBURGHHumanoids Summit Seoul: 22–23 September 2026, SEOULEnjoy today’s videos! Speaking from experience, I can tell you that the best part of any DARPA challenge is when things go horribly wrong. And after you enjoy all the crashes (followed by all of the battery fires), get caught up with the DARPA Lift Challenge with video recaps of the final few days. [ DARPA Lift Challenge ]Drone delivery: coming soon to a moving vehicle (or perhaps even through an open window) near you.[ HKUST Aerial Robotics Group ]This tiny little robot called STEMbot (as in stem, not STEM) can climb up and around plant stems to check for pests. It’s not very fast, but it sure is adorable.[ STEMbot ]Monumental’s robots delivered the brickwork for a semi-detached home, laying around 20,000 bricks in a new community.[ Monumental ]Meet the world’s most “truss’t-worthy” robot.[ Modlab University of Pennsylvania ]Stanford BDML and Honeybee Robotics propose a payload to test gecko-inspired adhesives in spaaace![ NASA ]How can a legged robot organize its own walking while maintaining a desired direction? In this work, we present a Differential Adaptive Steering (DAST) mechanism for directional adaptation in legged robots under decentralized adaptive control.[ BRAIN VISTEC ]I do not care even a little bit if a robot fails (safely, of course), as long as it recovers from that failure.[ Sanctuary AI ]Even for a robot that doesn’t drink champagne, those are some pretty light pours.[ Kawasaki Robotics ]If we as a society would just accept that the appropriate place to store clothing is in a pile on the floor, robots would have a much easier time of it.[ LimX Dynamics ]To be fair, this is also the speed at which I fold shirts.[ Sharpa ]Our DR02 humanoid robot takes on the stairs with stable, controlled movement—steady steps, steady progress.[ DEEP Robotics ]Two words: structural minifridge. Or is it mini fridge...? Whatever, THREE words.[ AgileX ]", "subcategory": "industrial"}, {"title": "Robot Recycler Salvages Parts From Broken Machines", "url": "https://spectrum.ieee.org/recycling-robot", "summary": "Objects constructed by robots are ubiquitous. If you’ve used a car, household appliance, or smartphone today, you’ve used an object constructed at least in part…", "source": "IEEE Spectrum", "category": "trend", "lang": "en", "title_en": "Robot Recycler Salvages Parts From Broken Machines", "summary_en": "Objects constructed by robots are ubiquitous. If you’ve used a car, household appliance, or smartphone today, you’ve used an object constructed at least in part…", "content_en": "Objects constructed by robots are ubiquitous. If you’ve used a car, household appliance, or smartphone today, you’ve used an object constructed at least in part by robots. The more products that manufacturers want to produce (and consumers want to consume) at lower costs, the more industrial robots will be needed.There are over 4 million industrial robots in use worldwide, according to the International Federation of Robotics. And researchers predict that number will grow to over 16 million by 2030, as manufacturing rapidly increases. But what’s going to happen when they start breaking down? A new system designed by researchers at the Karlsruhe Institute of Technology (KIT), in Karlsruhe, Germany, can predict the defect in a broken product and disassemble it while protecting valuable parts from damage. To continue robotic development sustainably, the industry should prepare for the dismantling, recycling, and rebuilding of our robotic systems.The system consists of a predictive algorithm that guesses how a product is broken, along with robotic manipulators that actually take the broken product apart. At every stage of the process, the system checks to see if the results align with its predictions, and updates its methods if necessary. For example, in the video below, the system begins by unscrewing a broken component. To simulate a stuck screw, the researcher replaces the screw. When the system observes the screw still in place, it switches to milling away material to remove the part. Building a product with new parts is easy, says Jan Baumgärtner, one of the designers of the system. Each step is clearly outlined, and there are no expected deviations. But taking apart something that’s broken is unpredictable. “We can imagine 100 ways that something can go wrong.” And if you start taking something apart without knowing how it broke, you might have to undo part of your work when you find the problem. For example, if you have to unscrew 100 screws holding two parts together, but the last screw is stuck, you’ll have wasted time unscrewing all those screws when you should have used a different method to remove the part in the first place.How to Take Apart a ProductKIT’s robotic disassembly system relies on a CAD model of the broken product and of each part, so it can see how the parts should behave and understand if anything is out of the ordinary. It also uses a mathematical model to predict the damage done to a broken part.When you give the system a broken device and a CAD model, it first guesses how each part of the broken device should move. The axes each part can move along are called degrees of freedom (for example, a screw should rotate, but not move side to side). The disassembler nudges each part to see if it moves as expected. Based on how the part actually moves, it then uses the mathematical model to predict what went wrong with the part: A corroded part might move less than you think it should, a loose screw may move more, and a deformed part might have different degrees of freedom than expected.At the beginning of disassembly, the system formulates a plan. It guesses what might be wrong with the device it’s taking apart, and then can change its guess based on observing each piece it takes apart. For example, if there was a screw loose in the part, that might be hard to guess from an initial photograph of the broken part. But when the system moves the screw, it will notice that it can move in more ways than a screw should move, and take that loose screw into account when deconstructing the device. You can also tell the disassembly system which parts are most important to salvage intact from a broken device, and it can adjust its strategy to preserve those specific parts.The Automated Circular EconomyBaumgärtner’s motivation behind the design of the robotic disassembler is to help create a circular economy, where old devices are repaired instead of thrown away, reducing waste. “The big future is saving our planet,” he says.Baumgärtner envisions scaling up this one system, composed of a few robotic arms, to have many robotic disassembler arms, each with different tools. These arms will specialize in a different part of the disassembly process so that an entire factory could use different robotic limbs to disassemble a wide range of products. Think of an industrial robot factory that creates cars, but instead is specialized to take them apart. Or, as he puts it, “as a giant robot with 100 arms.”Ultimately, if this system works as intended, it would be a fully automated way of extracting a broken part from a system, replacing it, and rebuilding the device. Then the circular economy would really shine, as people replaced broken parts in old devices instead of buying new ones all the time. “That’s why we need to think about scaling this,” he says. “Because it means it becomes so cheap that it’s cheaper to repair this [electronic device] than to produce it. That’s the goal.”This research was presented at the IEEE International Conference on Robotics and Automation (ICRA) 2026 in Vienna.This story was updated 11 August 2026 to clarify that the disassembly system works for products in general, not only robots.", "subcategory": "industrial"}, {"title": "微视频｜“新”在中国", "url": "http://www.news.cn/politics/2022-12/14/c_1129207254.htm", "summary": "新时代的中国，日新月异。", "source": "新华网时政", "category": "trend", "lang": "zh", "subcategory": "construction"}, {"title": "心血管病患者一旦感染新冠病毒，居家应该注意什么，如何避免基础病加重，何时需要去就医……【科学防疫小贴士】", "url": "http://www.news.cn/politics/2022-12/14/c_1129207057.htm", "summary": "心血管病患者如何做好防护避免被新冠病毒感染。一旦感染应该注意什么，基础病病情加重怎么办，如何评估是否需要去医院……北京安贞医院常务副院长周玉杰来解答。", "source": "新华网时政", "category": "trend", "lang": "zh", "subcategory": "construction"}, {"title": "老年人现在打疫苗晚不晚？受基础病影响的能不能打？独居老人是否有必要接种？【科学防疫小贴士】", "url": "http://www.news.cn/politics/2022-12/14/c_1129207047.htm", "summary": "在目前新冠流行的情况下，建议没有完成接种的老年人尽快接种，尽快按照程序完成全程和加强免疫，使疫苗的保护作用得到更好发挥。", "source": "新华网时政", "category": "trend", "lang": "zh", "subcategory": "construction"}, {"title": "为什么不再公布无症状感染者相关信息？中疾控专家解读", "url": "http://www.news.cn/politics/2022-12/14/c_1129207083.htm", "summary": "近日，我们接到群众对新冠肺炎疫情数据的有关疑问，现请中国疾控中心应急中心李群主任作出解答。", "source": "新华网时政", "category": "trend", "lang": "zh", "subcategory": "construction"}, {"title": "关于BQ.1，你需要知道的几件事——", "url": "http://www.news.cn/politics/2022-12/14/c_1129206954.htm", "summary": "近日网络流传：代号“地狱犬”的新冠变异毒株，在日本“杀疯了”？消息称，一种名为BQ.1.1的新型变异毒株已经出现。该毒株的传染性和致死率都很高，被称作“地狱犬”，已经在日本“杀疯了”。", "source": "新华网时政", "category": "trend", "lang": "zh", "subcategory": "construction"}, {"title": "6年、10年、12年，他们都经历了什么？", "url": "http://www.news.cn/politics/2022-12/14/c_1129206833.htm", "summary": "为了再次“飞天”圆梦，指令长陈冬准备了6年，刘洋已经准备整整10年，而首次飞向太空的蔡旭哲为了这一天，已经刻苦训练了12年。", "source": "新华网时政", "category": "trend", "lang": "zh", "subcategory": "construction"}, {"title": "习近平将向《生物多样性公约》第十五次缔约方大会第二阶段高级别会议开幕式致辞", "url": "http://www.news.cn/politics/2022-12/14/c_1129206906.htm", "summary": "外交部发言人华春莹14日宣布：国家主席习近平将于12月15日以视频方式向《生物多样性公约》第十五次缔约方大会第二阶段高级别会议开幕式致辞。", "source": "新华网时政", "category": "trend", "lang": "zh", "subcategory": "construction"}, {"title": "明起新一轮冷空气接踵而至 我国大部将迎大风降温", "url": "http://www.news.cn/politics/2022-12/14/c_1129206671.htm", "summary": "今天（12月14日），全国大部降水仍稀少，雨雪零散分布，冷空气影响也进入尾声阶段。不过，从明天开始，新一轮实力更强的冷空气接踵而至，将率先从新疆北部展开，随后逐渐给我国大部地区带来大风降温天气，同时西南、江汉等地降水也将增多。", "source": "新华网时政", "category": "trend", "lang": "zh", "subcategory": "construction"}, {"title": "Silver Creek Preserve in Bellevue, Idaho", "url": "https://www.atlasobscura.com/places/silver-creek-preserve", "summary": "In the high desert near Picabo, Idaho, a cold, wildlife-filled stream winds through wetlands and grasslands, fed not primarily by mountain runoff but by water e…", "source": "Atlas Obscura", "category": "trend", "lang": "en", "title_en": "Silver Creek Preserve in Bellevue, Idaho", "summary_en": "In the high desert near Picabo, Idaho, a cold, wildlife-filled stream winds through wetlands and grasslands, fed not primarily by mountain runoff but by water e…", "content_en": "In the high desert near Picabo, Idaho, a cold, wildlife-filled stream winds through wetlands and grasslands, fed not primarily by mountain runoff but by water emerging from the ground. Water from the surrounding hills and nearby Big Wood River percolates underground through an aquifer before being forced back toward the surface near the Picabo Hills. Numerous springs feed seven large tributaries of Silver Creek. The emerging water is alkaline, nutrient-rich, and stays at a relatively constant temperature throughout the year. Those conditions support abundant aquatic insects and a wild trout fishery, while the surrounding riparian habitat attracts moose, coyotes, bobcats, eagles, and more than 150 recorded bird species. The landscape visitors see today is also the result of a long restoration experiment. Before the preserve was established, livestock grazing, fishing pressure, erosion, and other disturbances had degraded portions of the creek and its watershed. The Nature Conservancy purchased the original 479-acre property in 1976 after encouragement from the local community. The preserve has since expanded to 882 acres, while more than 15,000 additional acres in the watershed have received protection, many through conservation easements.", "subcategory": "other"}, {"title": "APOD: 2026 September 1 – A Plane Lunar Eclipse", "url": "https://science.nasa.gov/image-article/apod-2026-september-1-a-plane-lunar-eclipse/", "summary": "APOD Science APOD APOD: 2026 September 1 – A… Today’s APOD Archive Submissions Index Search Calendar RSS Education About Discuss APOD Astronomy Picture of the D…", "source": "NASA", "category": "trend", "lang": "en", "title_en": "APOD: 2026 September 1 – A Plane Lunar Eclipse", "summary_en": "APOD Science APOD APOD: 2026 September 1 – A… Today’s APOD Archive Submissions Index Search Calendar RSS Education About Discuss APOD Astronomy Picture of the D…", "content_en": "APOD Science APOD APOD: 2026 September 1 – A… Today’s APOD Archive Submissions Index Search Calendar RSS Education About Discuss APOD Astronomy Picture of the Day Discover the cosmos! Each day a different image or photograph of our fascinating universe is featured, along with a brief explanation written by a professional astronomer. A Plane Lunar Eclipse Explanation: Did you need to be on the right side of this airplane to see this eclipse? No. Lunar eclipses are routinely seen from the half of the Earth facing the Moon when the eclipse occurs, making them some of the most commonly witnessed astronomical events. You don’t even need any special equipment to see one — just your unaided eyes. Lunar eclipses are also some of the most photographed astronomical events because, unlike with a solar eclipse, your eyes and camera do not have to look toward the bright Sun. However, considering the featured image taken last week from Portugal, if you were on the left side of that airplane during takeoff, you might have trouble seeing it — at first. But even then, after takeoff, since lunar eclipses typically last for hours, you might soon be able to safely cross the aisle(s) to see it. Gallery: Lunar Eclipse of 2026 AugustAPOD’s main NASA site is moving: From apod.nasa.gov to science.nasa.gov/apodTomorrow’s picture: cultural eclipses Date September 1, 2026 Credit Paulo Ferreira Authors & editors: Robert Nemiroff, Jerry Bonnell, Cecilia Chirenti, Keighley Rockcliffe A service of: ASD at NASA / GSFC,NASA Science Activation & Michigan Tech. U. Random APOD Generator Yesterday’s Image APOD: 2026 August 31 – Launch of the Roman Space Telescope Tomorrow’s Image", "subcategory": "other"}, {"title": "Timothy Dexter’s William Pitt Statue in Newburyport, Massachusetts", "url": "https://www.atlasobscura.com/places/timothy-dexters-william-pitt-statue", "summary": "Newburyport is one of the most well-known and vibrant coastal communities in Massachusetts. Located near the mouth of the Merrimack River and Plum Island, it ha…", "source": "Atlas Obscura", "category": "trend", "lang": "en", "title_en": "Timothy Dexter’s William Pitt Statue in Newburyport, Massachusetts", "summary_en": "Newburyport is one of the most well-known and vibrant coastal communities in Massachusetts. Located near the mouth of the Merrimack River and Plum Island, it ha…", "content_en": "Newburyport is one of the most well-known and vibrant coastal communities in Massachusetts. Located near the mouth of the Merrimack River and Plum Island, it has a long history of shipping, fishing, tourism, and is officially recognized as the founding location of the US Coast Guard. The Museum of Old Newbury is dedicated to the history of Newburyport, its surrounding communities, and is housed inside a grand Federal style mansion built in the early 1800s. There are many historic and unique artifacts on display, but perhaps the most striking that immediately grabs the attention of visitors, is the large wooden painted statue of a man in military uniform standing on the stairs and seemingly following you with its eyes. The peculiarity of this relic was most likely done intentionally, as it was once owned by one of the most peculiar and eccentric wealthy businessmen in early American history. Timothy Dexter was born in colonial Massachusetts in 1747 to a poor family of English and Irish ancestry. He dropped out of school at around age 8 to become a farmhand and at age 16 he became a tanner's apprentice. In 1769 at age 21, he moved to Newburyport and married 32-year-old Elizabeth Frothingham, a very rich widow. Using the money he acquired, he purchased a large mansion and began his incredibly bizarre yet prosperous business ventures. After the American Revolution had ended, Continental Dollars had depreciated to the point of worthlessness and could be acquired easily. Dexter bought huge sums of these dollars and when the US government decided to honor its debt, he made a considerable profit. He used the money to build two ships and began an export business to the Caribbean and Europe selling rather unusual items. He sold bed warmers, designed for cold New England winters to the West Indies, a tropical climate. It seemed illogical to do so, but the local molasses industry repurposed them as ladles instead. Dexter also sent a shipment of wool gloves to the West Indies which were purchased by Russian merchants who were docked at the time and later resold in Siberia. He also exported a large number of stray cats to the Caribbean which were purchased by locals to control the rodent population. He also hoarded a lot of whalebones which were later fashioned into corset stays. Dexter's success and uncommon good fortune made him the envy of New England high society who thought of ways to bankrupt him. Some suggested he \"sell coal to Newcastle\" in England, which was an idiom describing a pointless or futile action as the city was one of the largest coal producers in the world during the 18th century. Dexter took the suggestion literally and sent a large shipment of coal which was bought at a premium because the local miners were on strike at the time. He was also convinced to sell trousers, gloves, hides, and whale blubber to the East Indies which were bought just in time by Portuguese merchants on their way to China. Although snubbed and mocked by other elites in society, Dexter was proud of his particular style of business acumen and seeing value in items that others considered worthless. He used his immense wealth to decorate his home with minarets, a mausoleum for himself, and outside he placed 40 life-size sculptures of various famous men throughout his life including George Washington, Thomas Jefferson, Napoleon Bonaparte, William Pitt the Elder, and himself. The sculpture of himself he had engraved, \"I am the first in the East, the first in the West, and the greatest philosopher in the Western World\". He called himself \"Lord Timothy Dexter\" and offered money to people who called him \"Lord Chester\" whenever he was staying at his estate in Chester, New Hampshire. Other eccentric aspects of his personality included telling people his wife (who was alive) had died and the woman in their home was her ghost, faking his death and holding a mock funeral just to see how many people would show up, and sending repeated petitions to be appointed for public office in which he was given the title \"Informer of Deer\", which was to tell people whenever deer were in town and enforce local deer hunting laws despite the fact no deer lived in Newburyport. Towards the end of his life in 1802, he published a book titled A Pickle for the Knowing Ones, in which he complained mostly about politicians, the clergy, and his wife. The book is notable for having incredibly poor grammar, spelling, and having no punctuations of any kind. After his death in 1806, his estate and much of his belongings were auctioned off. The Great September Gale and New England Hurricane of 1815 destroyed most of the outdoor sculptures with those remaining being sold or salvaged for firewood. The only surviving sculpture today is the one of William Pitt the Elder which was once owned by the Smithsonian and restored before being returned to Newburyport where it’s on display at the Museum of Old Newbury. Both Dexter and the sculpture of William Pitt are certainly quite peculiar oddities and definitely worth taking a look and learning more about if you’re interested.", "subcategory": "other"}, {"title": "Ice Island Survives Run-In With Joe Island", "url": "https://science.nasa.gov/earth/earth-observatory/iceberg-from-petermann-glacier-speeds-away/", "summary": "In summer 2026, a substantial iceberg calved from Petermann Glacier in northwest Greenland and swiftly drifted into Nares Strait, colliding with an island along…", "source": "NASA", "category": "trend", "lang": "en", "title_en": "Ice Island Survives Run-In With Joe Island", "summary_en": "In summer 2026, a substantial iceberg calved from Petermann Glacier in northwest Greenland and swiftly drifted into Nares Strait, colliding with an island along…", "content_en": "Earth Observatory Science Earth Observatory Ice Island Survives Run-In… Earth Earth Observatory Image of the Day EO Explorer Topics All Topics Atmosphere Land Heat & Radiation Life on Earth Human Dimensions Natural Events Oceans Remote Sensing Technology Snow & Ice Water More Content Collections Global Maps World of Change Articles Earth Matters Blog Blue Marble: Next Generation EO Kids Mission: Biomes About About Us Subscribe 🛜 RSS Contact Us Search AUGUST 24 AUGUST 23 A satellite view shows the iceberg after it pivoted out of the fjord into Nares Strait, wedged against a small, brown island. NASA Earth Observatory / Lauren Dauphin A satellite view shows a large tabular iceberg at the junction of its home fjord and Nares Strait. NASA Earth Observatory / Lauren Dauphin AUGUST 24AUGUST 23 A satellite view shows the iceberg after it pivoted out of the fjord into Nares Strait, wedged against a small, brown island. NASA Earth Observatory / Lauren Dauphin A satellite view shows a large tabular iceberg at the junction of its home fjord and Nares Strait. NASA Earth Observatory / Lauren Dauphin AUGUST 24 AUGUST 23 CurtainToggle2-Up Image Details An iceberg from Petermann Glacier encounters Joe Island in northwestern Greenland, visible in images captured by the OLI (Operational Land Imager) on Landsat 9 on August 23, 2026 (right), and August 24, 2026 (left). NASA Earth Observatory images by Lauren Dauphin. Summer is prime iceberg season in Greenland’s glacier-fed fjords, and 2026 was no exception. Especially notable was the berg that broke from the Petermann Glacier along Greenland’s northwest coast in August. Roughly the size of St. Thomas in the U.S. Virgin Islands, it was the largest calving event by any Arctic glacier since 2020. Iceberg calving is a routine part of an outlet glacier’s life cycle. Scientists watch the process closely, however, along with numerous other observations of the ice and its environment, for longer-term signs of instability. Petermann is one of Greenland’s largest marine-terminating glaciers and acts as a gatekeeper for ice flowing from the ice sheet into the ocean. Its future stability has implications for sea level rise. The calving event of summer 2026 was spotted on August 4 by Adam Garbo, a doctoral student in glaciology at the University of Ottawa, in imagery from the European Space Agency’s Sentinel-1 mission. Garbo and an international team of colleagues have been using remote sensing to study and track the glacier’s ice tongue. The team reported that the large tabular iceberg, or “ice island,” measured just over 76 square kilometers (29 square miles) at the time it calved—the largest to break from the glacier since the ice island of 2012 (130 square kilometers). The 2012 calving followed earlier major events in 2008 (31 square kilometers) and 2010 (just over 250 square kilometers). The August 2026 event could have been even bigger. Garbo and colleagues had been expecting a major calving once one of the large rifts they were monitoring finally cut all the way across Petermann’s ice tongue. “What surprised us was that the calving instead followed a different fracture, producing a smaller ice island than we had originally anticipated,” Garbo said. As of late August, two large rifts remained and were expected to eventually produce new ice islands of roughly 94 square kilometers and 84 square kilometers, though the timing remained uncertain. August 24, 2026 NASA Earth Observatory/Lauren Dauphin Glaciologist Mauri Pelto of Nichols College has also been tracking the iceberg, using images from NASA-USGS Landsat satellites, as it drifted down Petermann Fjord toward Nares Strait. In the week since it calved, the berg drifted an average of 3 kilometers per day. It continued toward the fjord’s junction with Nares Strait, where it rammed into a small rocky outcrop known as Joe Island (Joe Ø). The brief encounter is visible in images captured by the OLI (Operational Land Imager) on Landsat 9 on August 23 (top right) and August 24 (top left). A detailed view of the August 24 image is shown above. Joe Island sits at the mouth of Petermann Fjord, making it one of the first obstacles a departing ice island meets. Collisions with it—like the one that split the 2010 ice island in two—often mark the start of a berg’s breakup. Petermann bergs tend to be thinner and more fragile than those calved by glaciers such as Greenland’s Jakobshavn and Helheim, and thinner still than Antarctica’s behemoths, Pelto noted. “We were certainly watching closely as it interacted with Joe Island and were impressed that it survived the interaction without further fragmentation,” Garbo said. The ice island was estimated to be less than 150 meters thick at the time of calving. Wind and surface currents have swept it out of the fjord, and satellite images show it pivoting away from Joe Island and continuing southwest through Nares Strait. As it drifts, it will fracture into smaller pieces as tides, winds, currents, and melting continue to weaken the ice. Thicker bergs that calve from tidewater glaciers without floating ice-shelf extensions can drag and even become grounded on the seafloor within the fjord, while ice islands, like those from Petermann, might run aground later in their drift. Many ice islands have become “grounded” off the coasts of Coburg and Baffin islands. Garbo and colleagues noted that ice islands and their fragments have been known to travel considerable distances, posing potential hazards to marine activities and infrastructure while also distributing freshwater through the ocean as they melt. NASA Earth Observatory images by Lauren Dauphin, using Landsat data from the U.S. Geological Survey. Story by Kathryn Hansen. Downloads August 23, 2026 JPEG (12.59 MB) August 24, 2026 JPEG (10.23 MB) References & Resources Åkesson, H., et al. (2022) Petermann ice shelf may not recover after a future breakup. Nature Communications, 13(2519). Crawford, A. J., et al. (2016) Journey of an Arctic Ice Island. Oceanography, 29(2), 254–263. Eos (2011, April 5) Context for the Recent Massive Petermann Glacier Calving Event. Accessed August 28, 2026. The European Space Agency (2026, August 21) Sentinel-1 captures major ice loss from Greenland glacier. Accessed August 28, 2026. Fahrner, D., et al. (2026) Petermann Glacier on the brink: Progress, challenges and insights. Science Advances, 12(33). From a Glaciers Perspective (2026, August 17) Petermann Glacier, NW Greenland Releases Massive Iceberg in August 2026. Accessed August 28, 2026. NASA Earth Observatory (2023, May 20) Retreat at Petermann Glacier. Accessed August 28, 2026. NASA Earth Observatory (2012, August 2) Ice Island Drifts away from Petermann Glacier. Accessed August 28, 2026. NASA Earth Observatory (2010, August 10) Ice Island calves off Petermann Glacier. Accessed August 28, 2026. uOttawa (2026, August 7) Greenland glacier break creates new ice island. Accessed August 28, 2026. You may also be interested in: Stay up-to-date with the latest content from NASA as we explore the universe and discover more about our home planet. Record-Setting Retreat of Hektoria Glacier 5 min read Scientists relied on satellite data to understand how the Antarctic glacier lost so much ice so rapidly. Article Pasterze Hangs on as Austria’s Largest Glacier 4 min read One narrowing icefall remains the linchpin for the Alpine glacier—and it may not be long for this world. Article An Uncommon Drifter in the Denmark Strait 4 min read A large iceberg, observed in summer 2026, had drifted more than 1,000 kilometers south from the northeastern Greenland bay where… Article 1 2 3 4 Next Keep Exploring Discover More from NASA Earth Science Subscribe to Earth Observatory Newsletters Subscribe to the Earth Observatory and get the Earth in your inbox. Earth Observatory Image of the Day NASA’s Earth Observatory brings you the Earth, every day, with in-depth stories and stunning imagery. Explore Earth Science Earth Science Data Open access to NASA’s archive of Earth science data", "subcategory": "other"}, {"title": "Acueducto de La Partida in Madrid, Spain", "url": "https://www.atlasobscura.com/places/acueducto-de-la-partida", "summary": "Madrid may have its famous fountains and grand boulevards, but hidden in the Casa de Campo is a rather more unexpected piece of engineering: a small 18th-centur…", "source": "Atlas Obscura", "category": "trend", "lang": "en", "title_en": "Acueducto de La Partida in Madrid, Spain", "summary_en": "Madrid may have its famous fountains and grand boulevards, but hidden in the Casa de Campo is a rather more unexpected piece of engineering: a small 18th-centur…", "content_en": "Madrid may have its famous fountains and grand boulevards, but hidden in the Casa de Campo is a rather more unexpected piece of engineering: a small 18th-century aqueduct. Built in 1778, the Acueducto de La Partida carried water from the park’s lake to the Huerta de la Partida, helping to irrigate the royal gardens and orchards. Its designer was Francisco Sabatini, the royal architect responsible for some of Madrid’s most monumental landmarks. Sabatini’s connection with the Casa de Campo does not end here. He was also involved with several of its bridges, including the Puente de la Culebra, although his exact role in their construction remains a matter of historical debate. It is a charming reminder that the man associated with the Puerta de Alcalá and the Palacio Real also turned his attention to the rather less glamorous business of getting water across a stream. Perhaps the most surprising thing is how little known this aqueduct is—even among Madrileños. The Casa de Campo contains the remains some otheraqueducts, built at different times to carry its intricate network of irrigation channels across streams and valleys. So while visitors stroll, cycle, jog, and picnic through one of Europe’s largest urban parks, they may be walking through a landscape quietly crisscrossed by forgotten waterways. The Acueducto de La Partida is the oldest surviving example, restored in 2016 and now standing rather proudly beside the paths near the lake. It may lack the monumental scale of Segovia’s famous aqueduct, but Madrid has never been particularly short of surprises—and this one comes with the added bonus of being designed by Sabatini.", "subcategory": "other"}, {"title": "NASA Welcomes Türkiye as Newest Artemis Accords Signatory", "url": "https://www.nasa.gov/organizations/oiir/artemis-accords/nasa-welcomes-turkiye-as-newest-artemis-accords-signatory/", "summary": "During a ceremony hosted by NASA Administrator Jared Isaacman at the agency’s headquarters in Washington on Monday, the Republic of Türkiye signed the Artemis A…", "source": "NASA", "category": "trend", "lang": "en", "title_en": "NASA Welcomes Türkiye as Newest Artemis Accords Signatory", "summary_en": "During a ceremony hosted by NASA Administrator Jared Isaacman at the agency’s headquarters in Washington on Monday, the Republic of Türkiye signed the Artemis A…", "content_en": "Turkish Minister of Industry and Technology, Mehmet Fatih Kacır, 3rd from left, signs the Artemis Accords for the Republic of Türkiye as NASA Administrator Jared Isaacman, left, U.S. Deputy Assistant Secretary of State for Space and Environment Connor Tomlinson, and Turkish Space Agency President, Yusuf Kıraç, right, look on, Monday, August 31, 2026, at the Mary W. Jackson NASA Headquarters building in Washington. NASA/Bill Ingalls During a ceremony hosted by NASA Administrator Jared Isaacman at the agency’s headquarters in Washington on Monday, the Republic of Türkiye signed the Artemis Accords, joining the growing international coalition of like-minded nations dedicated to peaceful, transparent space exploration. “It is my privilege to welcome the Republic of Türkiye as the 71st signatory of the Artemis Accords,” said Isaacman. “Last year, President Trump directed NASA to accelerate its return to the lunar surface and establish humanity’s first enduring presence on another world, a Moon Base, as well as lay the foundation for the manned exploration of Mars. NASA never undertakes these grand endeavors alone. On the Moon Base, we’re taking the Artemis Accords principles and putting them into practice on the lunar surface. NASA has invited every signatory to take part in this endeavor, creating opportunities for nations to contribute major pieces of hardware, scientific payloads, technology demonstrations, CubeSats, and other capabilities to future Artemis missions.” Turkish Minister of Industry and Technology Mehmet Fatih Kacır signed on behalf of Türkiye. The President of the Turkish Space Agency Yusuf Kıraç, and the U.S. Deputy Assistant Secretary of State for Space and Environment Connor Tomlinson, also participated in the event. Türkiye’s recent achievements in human spaceflight underscore its commitment to space exploration. In 2024, the country’s first astronaut, Alper Gezervaci, traveled to the International Space Station on Axiom Mission 3 and conducted scientific research alongside NASA astronauts. That same year, a second Turkish astronaut, Tuva Atasever, flew on Virgin Galactic 07 suborbital mission, conducting experiments and physiology research. Türkiye will soon launch its first lunar mission, AYAP-1, joining the small but growing group of countries building and launching their own satellites to the Moon. The country’s signing also comes as the country prepares to host the International Astronautical Congress in Antalya this October. Dozens of Artemis Accords signatories are expected to attend to discuss the future of peaceful and transparent space exploration. In 2020, NASA and the State Department joined with seven other founding nations to establish the Artemis Accords, responding to the growing interest in lunar activities by both governments and private companies. They introduced the first set of practical principles aimed at enhancing the safety and coordination between nations as they explore the Moon, Mars, and beyond, committing nations to: explore peaceably and transparently render aid to those in need enable access to scientific data ensure activities do not interfere with those of others preserve historically significant sites and artifacts by developing best practices By signing the Artemis Accords, nations open the door to opportunities for future lunar exploration with NASA, advancing humanity’s return to the Moon, and shaping the Golden Age of space exploration and innovation. Learn more about the Artemis Accords at: https://www.nasa.gov/artemis-accords -end- Share Details Last Updated Aug 31, 2026 LocationNASA Headquarters Related TermsArtemis AccordsArtemisGeneralOffice of International and Interagency Relations (OIIR)", "subcategory": "other"}, {"title": "AI色情短剧黑链曝光 4万月薪招编剧", "url": "https://m.baidu.com/s?word=AI%E8%89%B2%E6%83%85%E7%9F%AD%E5%89%A7%E9%BB%91%E9%93%BE%E6%9B%9D%E5%85%89+4%E4%B8%87%E6%9C%88%E8%96%AA%E6%8B%9B%E7%BC%96%E5%89%A7&sa=fyb_news", "summary": "", "source": "百度热搜", "category": "trend", "lang": "zh", "subcategory": "other"}, {"title": "中国气象局推进气象行业可信数据空间建设", "url": "https://www.jiemian.com/article/15042311.html", "summary": "会议要求，立足行业统筹发展，建立健全可信空间制度规则体系，前瞻布局行业数据流通治理机制建设；积极探索与其他可信数据空间互联互通，深度融入全国一体化数据流通体系；聚焦重点场景落地应用，迭代优化平台功能、创新服务供给模式，通过安全可信的数据流通充分释放气象数据要素价值，赋能经济社会发展。", "source": "界面新闻", "category": "trend", "lang": "zh", "subcategory": "other"}, {"title": "Bunker Tombé in Sainte-Marguerite-sur-Mer, France", "url": "https://www.atlasobscura.com/places/bunker-tombe", "summary": "The Bunker in Sainte Marguerite sur Mer is a massive WWII German blockhaus that originally sat atop the coastal cliffs before decades of erosion caused it to pl…", "source": "Atlas Obscura", "category": "trend", "lang": "en", "title_en": "Bunker Tombé in Sainte-Marguerite-sur-Mer, France", "summary_en": "The Bunker in Sainte Marguerite sur Mer is a massive WWII German blockhaus that originally sat atop the coastal cliffs before decades of erosion caused it to pl…", "content_en": "The Bunker in Sainte Marguerite sur Mer is a massive WWII German blockhaus that originally sat atop the coastal cliffs before decades of erosion caused it to plunge onto the beach below, landing almost perfectly vertically in the sand. Today, it stands as a surreal, monolithic attraction that gained modern fame after street artist JR and filmmaker Agnès Varda featured it in their 2016 documentary “Faces Places,” temporarily covering it in a giant mural that the sea washed away within a single day. Because it sits on an isolated stretch of pebble shoreline beneath sheer chalk walls, visitors hiking down to this striking concrete ruin must carefully check local tide tables in advance, as the high tide completely covers the beach and leaves no escape route up the cliffs.", "subcategory": "other"}, {"title": "September 2026 Satellite Puzzler", "url": "https://science.nasa.gov/earth/earth-observatory/september-2026-satellite-puzzler/", "summary": "Here’s the August 2026 puzzler. Quick, where is this? And what makes this place interesting or unique?", "source": "NASA", "category": "trend", "lang": "en", "title_en": "September 2026 Satellite Puzzler", "summary_en": "Here’s the August 2026 puzzler. Quick, where is this? And what makes this place interesting or unique?", "content_en": "Every month, NASA Earth Observatory features a puzzling satellite image. The September 2026 puzzler appears above. Your ChallengeIdentify the location shown in this satellite image. Share what clues you see, where you think it is, and what makes this place interesting or unique to you. How to AnswerSubmit your response using this form and select “Puzzler Answer” as the topic. Please include your preferred name or alias. You can keep it simple and just guess the location. Want to impress us? Tell us which satellite and instrument captured the image, which spectral bands were used, or point out a subtle detail about the geology or history of the area. If something catches your eye, or if this is your home or means something to you, we’d love to hear about it. The PrizeWe can’t offer prize money or a trip to space to see Earth like satellites and astronauts do. But we can offer something almost as rewarding: puzzler bragging rights. About a week after the challenge, we’ll post the answer at the top of this page, along with a link to an Earth Observatory Image of the Day story that explains the image in more detail. We’ll recognize the first person who correctly guesses the location, and we may also highlight readers who share especially thoughtful or interesting answers. By submitting a response, you acknowledge that your comments may be edited, excerpted, and published on this page. Until then, zoom in, look closely, and enjoy the challenge. See you at the reveal!", "subcategory": "other"}], "brief": "今日为您精选 117 条要闻：20 条重大事件、30 条热点、67 条行业趋势，点击标题即可跳转原文阅读。", "backgrounds": {"day": ["https://www.bing.com/th?id=OHR.HorseHairShroom_ZH-CN2241458451_1920x1080.jpg", "https://www.bing.com/th?id=OHR.SamarkandCeiling_ZH-CN1818913296_1920x1080.jpg", "https://www.bing.com/th?id=OHR.YellowShark_ZH-CN1570569826_1920x1080.jpg", "https://www.bing.com/th?id=OHR.SantaCatarina_ZH-CN4170292043_1920x1080.jpg", "https://www.bing.com/th?id=OHR.MichelSunset_ZH-CN0822968543_1920x1080.jpg", "https://www.bing.com/th?id=OHR.LakeMagadi_ZH-CN0601527009_1920x1080.jpg", "https://www.bing.com/th?id=OHR.RedwoodPark_ZH-CN9513051062_1920x1080.jpg", "https://www.bing.com/th?id=OHR.BKBridge_ZH-CN3870511222_1920x1080.jpg", "https://www.bing.com/th?id=OHR.EndofHeatY26_ZH-CN8936468848_1920x1080.jpg", "https://www.bing.com/th?id=OHR.CommonBlue_ZH-CN8521430009_1920x1080.jpg", "https://www.bing.com/th?id=OHR.JulierPass_ZH-CN3064797820_1920x1080.jpg", "https://www.bing.com/th?id=OHR.LynnCanalOrca_ZH-CN0719217908_1920x1080.jpg"], "night": ["https://www.bing.com/th?id=OHR.AurorasIceland_ZH-CN9781322454_1920x1080.jpg", "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1920&q=80", "https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=1920&q=80", "https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?w=1920&q=80", "https://images.unsplash.com/photo-1465101162946-4377e57745c3?w=1920&q=80", "https://images.unsplash.com/photo-1502134249126-9f3755a50d78?w=1920&q=80", "https://images.unsplash.com/photo-1470813740244-df37b8c1edcb?w=1920&q=80"]}};

    ["science", "robotics", "finance", "digital", "industrial", "construction", "other"];

  /* ============ 背景图：白天自然风光 / 夜晚宇宙星空 ============ */
  var BGS = NEWS_DATA.backgrounds || { day: [], night: [] };

  function pickBackground() {
    var h = new Date().getHours();
    var isNight = (h >= 18 || h < 6);  // 18:00 - 次日 06:00 为夜晚
    var pool = isNight ? (BGS.night.length ? BGS.night : BGS.day) : (BGS.day.length ? BGS.day : BGS.night);
    if (!pool.length) return;
    var idx = Math.floor(Math.random() * pool.length);
    document.getElementById("bgLayer").style.backgroundImage = 'url("' + pool[idx] + '")';
    document.body.classList.toggle("night", isNight);
  }

  function startBackgroundTimer() {
    pickBackground();
    // 每小时检查一次是否切换昼夜；每 5 分钟轮换一张同类别背景
    setInterval(pickBackground, 5 * 60 * 1000);
  }

  document.getElementById("dateLabel").textContent =
    (NEWS_DATA.date_cn || "") + " " + (NEWS_DATA.weekday || "");
  document.getElementById("brief").textContent = NEWS_DATA.brief ||
    "以下为今日热点、重大事件与行业趋势精选，点击标题可跳转原文阅读全文。";
  document.getElementById("genInfo").textContent =
    "更新于 " + (NEWS_DATA.generated_at || "");

  // 统计各分类数量
  var counts = { all: NEWS_DATA.items.length };
  NEWS_DATA.items.forEach(function(it) { counts[it.category] = (counts[it.category] || 0) + 1; });

  var tabs = [ { key: "all", label: "全部" } ].concat(
    ORDER.map(function(k) { return { key: k, label: CAT_LABEL[k] || k }; })
  );

  var tabsEl = document.getElementById("tabs");
  tabs.forEach(function(t) {
    var b = document.createElement("button");
    b.className = "tab" + (t.key === "all" ? " active" : "");
    b.dataset.key = t.key;
    b.innerHTML = t.label + '<span class="count">' + (counts[t.key] || 0) + "</span>";
    b.onclick = function() { setMainTab(t.key); };
    tabsEl.appendChild(b);
  });

  var subTabsEl = document.getElementById("subTabs");
  SUB_ORDER.forEach(function(key) {
    var b = document.createElement("button");
    b.className = "sub-tab" + (key === "all" ? " active" : "");
    b.dataset.sub = key;
    b.textContent = SUB_LABEL[key] || key;
    b.onclick = function() { setSubTab(key); };
    subTabsEl.appendChild(b);
  });

  var listEl = document.getElementById("list");
  var curMain = "all";
  var curSub = "all";

  function setMainTab(key) {
    curMain = key;
    curSub = "all";
    var btns = tabsEl.querySelectorAll(".tab");
    btns.forEach(function(b) { b.classList.toggle("active", b.dataset.key === key); });
    subTabsEl.classList.toggle("show", key === "trend");
    if (key === "trend") {
      subTabsEl.querySelectorAll(".sub-tab").forEach(function(s) {
        s.classList.toggle("active", s.dataset.sub === "all");
      });
    }
    render();
  }

  function setSubTab(sub) {
    curSub = sub;
    subTabsEl.querySelectorAll(".sub-tab").forEach(function(s) {
      s.classList.toggle("active", s.dataset.sub === sub);
    });
    render();
  }

  function render() {
    var items = NEWS_DATA.items.filter(function(it) {
      if (curMain !== "all" && it.category !== curMain) return false;
      if (curMain === "trend" && curSub !== "all" && (it.subcategory || "other") !== curSub) return false;
      return true;
    });

    if (!items.length) {
      listEl.innerHTML = '<div class="empty">暂无内容</div>';
      return;
    }

    listEl.innerHTML = items.map(function(it) {
      var label = CAT_LABEL[it.category] || it.category;
      var sub = it.category === "trend" ? (it.subcategory || "other") : null;
      var subLabel = sub
        ? '<span class="tag sub-' + sub + '">' + (SUB_LABEL[sub] || "其他") + "</span>" : "";
      // 英文原文展示（国外源）
      var enHtml = "";
      if (it.lang === "en" && it.title_en) {
        enHtml = '<p class="en">' + escapeHtml(it.title_en) + "</p>";
      }
      // 英文源：页面内阅读模式（点击弹窗，不跳转广告/会员墙）；中文源：直接跳转
      if (it.lang === "en") {
        var idx = NEWS_DATA.items.indexOf(it);
        return (
          '<div class="card cat-' + it.category + '" style="cursor:pointer;" data-idx="' + idx + '">' +
            '<div class="card-top">' +
              '<span class="tag ' + it.category + '">' + label + "</span>" +
              subLabel +
              '<span class="source">' + (it.source || "") + "</span>" +
            "</div>" +
            "<h2>" + escapeHtml(it.title) + "</h2>" +
            (it.summary ? '<p class="summary">' + escapeHtml(it.summary) + "</p>" : "") +
            enHtml +
          "</div>"
        );
      }
      return (
        '<a class="card cat-' + it.category + '" href="' + it.url + '" target="_blank" rel="noopener noreferrer">' +
          '<div class="card-top">' +
            '<span class="tag ' + it.category + '">' + label + "</span>" +
            subLabel +
            '<span class="source">' + (it.source || "") + "</span>" +
          "</div>" +
          "<h2>" + escapeHtml(it.title) + "</h2>" +
          (it.summary ? '<p class="summary">' + escapeHtml(it.summary) + "</p>" : "") +
          enHtml +
        "</a>"
      );
    }).join("");
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ============ 页面内阅读模式（英文源，规避广告/会员墙） ============ */
  var readerOverlay = document.getElementById("readerOverlay");

  function openReaderByIdx(idx) {
    var it = NEWS_DATA.items[idx];
    if (!it) return;
    document.getElementById("readerSource").textContent = it.source || "";
    document.getElementById("readerTitle").textContent = it.title || "";
    var bodyHtml = "";
    if (it.content_en) {
      bodyHtml += '<div style="white-space:pre-wrap;">' + escapeHtml(it.content_en) + "</div>";
    } else if (it.summary_en) {
      bodyHtml += '<div style="white-space:pre-wrap;">' + escapeHtml(it.summary_en) + "</div>";
    }
    bodyHtml += '<div class="orig-link"><a href="' + escapeHtml(it.url || "#") + '" target="_blank" rel="noopener noreferrer">\u2197 查看原文（原网站）</a></div>';
    document.getElementById("readerBody").innerHTML = bodyHtml;
    readerOverlay.classList.add("show");
  }

  // 事件委托：点击英文卡片打开阅读弹窗
  listEl.addEventListener("click", function(e) {
    var card = e.target.closest('[data-idx]');
    if (card) {
      var idx = parseInt(card.getAttribute("data-idx"), 10);
      if (!isNaN(idx)) { openReaderByIdx(idx); }
    }
  });

  document.getElementById("readerClose").onclick = function() {
    readerOverlay.classList.remove("show");
  };
  readerOverlay.onclick = function(e) {
    if (e.target === readerOverlay) readerOverlay.classList.remove("show");
  };
  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") readerOverlay.classList.remove("show");
  });

  render();
  startBackgroundTimer();
</script>
</body>
</html>
