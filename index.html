    document.getElementById("bgLayer").style.backgroundImage = 'url("' + pool[idx] + '")';
    document.body.classList.toggle("night", isNight);
  }

  function startBackgroundTimer() {
    pickBackground();
    // 每小时检查一次是否切换昼夜；每 5 分钟轮换一张同类别背景
    setInterval(pickBackground, 5 * 60 * 1000);
  }

  document.getElementById("dateLabel").textContent =
    (NEWS_DATA.date_cn || "") + " " + (NEWS_DATA.weekday || "");
  document.getElementById("brief").textContent = NEWS_DATA.brief ||
    "以下为今日热点、重大事件与行业趋势精选，点击标题可跳转原文阅读全文。";
  document.getElementById("genInfo").textContent =
    "更新于 " + (NEWS_DATA.generated_at || "");

  // 统计各分类数量
  var counts = { all: NEWS_DATA.items.length };
  NEWS_DATA.items.forEach(function(it) { counts[it.category] = (counts[it.category] || 0) + 1; });

  var tabs = [ { key: "all", label: "全部" } ].concat(
    ORDER.map(function(k) { return { key: k, label: CAT_LABEL[k] || k }; })
  );

  var tabsEl = document.getElementById("tabs");
  tabs.forEach(function(t) {
    var b = document.createElement("button");
    b.className = "tab" + (t.key === "all" ? " active" : "");
    b.dataset.key = t.key;
    b.innerHTML = t.label + '<span class="count">' + (counts[t.key] || 0) + "</span>";
    b.onclick = function() { setMainTab(t.key); };
    tabsEl.appendChild(b);
  });

  var subTabsEl = document.getElementById("subTabs");
  SUB_ORDER.forEach(function(key) {
    var b = document.createElement("button");
    b.className = "sub-tab" + (key === "all" ? " active" : "");
    b.dataset.sub = key;
    b.textContent = SUB_LABEL[key] || key;
    b.onclick = function() { setSubTab(key); };
    subTabsEl.appendChild(b);
  });

  var listEl = document.getElementById("list");
  var curMain = "all";
  var curSub = "all";

  function setMainTab(key) {
    curMain = key;
    curSub = "all";
    var btns = tabsEl.querySelectorAll(".tab");
    btns.forEach(function(b) { b.classList.toggle("active", b.dataset.key === key); });
    subTabsEl.classList.toggle("show", key === "trend");
    if (key === "trend") {
      subTabsEl.querySelectorAll(".sub-tab").forEach(function(s) {
        s.classList.toggle("active", s.dataset.sub === "all");
      });
    }
    render();
  }

  function setSubTab(sub) {
    curSub = sub;
    subTabsEl.querySelectorAll(".sub-tab").forEach(function(s) {
      s.classList.toggle("active", s.dataset.sub === sub);
    });
    render();
  }

  function render() {
    var items = NEWS_DATA.items.filter(function(it) {
      if (curMain !== "all" && it.category !== curMain) return false;
      if (curMain === "trend" && curSub !== "all" && (it.subcategory || "other") !== curSub) return false;
      return true;
    });

    if (!items.length) {
      listEl.innerHTML = '<div class="empty">暂无内容</div>';
      return;
    }

    listEl.innerHTML = items.map(function(it) {
      var label = CAT_LABEL[it.category] || it.category;
      var sub = it.category === "trend" ? (it.subcategory || "other") : null;
      var subLabel = sub
        ? '<span class="tag sub-' + sub + '">' + (SUB_LABEL[sub] || "其他") + "</span>" : "";
      // 英文原文：点击翻译
      var enHtml = "";
      if (it.lang === "en" && it.title_en) {
        enHtml = '<span class="en" data-en="' + escapeHtml(it.title_en) + '" onclick="event.stopPropagation(); showTransInline(this);">\u2192 点击翻译</span>';
      }
      return (
        '<div class="card cat-' + it.category + '">' +
          '<a href="' + it.url + '" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit;display:block;">' +
            '<div class="card-top">' +
              '<span class="tag ' + it.category + '">' + label + "</span>" +
              subLabel +
              '<span class="source">' + (it.source || "") + "</span>" +
            "</div>" +
            "<h2>" + escapeHtml(it.title) + "</h2>" +
            (it.summary ? '<p class="summary">' + escapeHtml(it.summary) + "</p>" : "") +
          "</a>" +
          enHtml +
        "</div>"
      );
    }).join("");
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  render();
  startBackgroundTimer();

  /* ============ 点击翻译（国外源英文标题） ============ */
  function translateText(text, cb) {
    var url = "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(text) + "&langpair=en|zh-CN";
    fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var t = d.responseData && d.responseData.translatedText;
        if (t && t !== "PLEASE SELECT TWO DISTINCT LANGUAGES") {
          cb(null, t);
        } else {
          cb(new Error("no result"), null);
        }
      })
      .catch(function(e) {
        var url2 = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=" +
          encodeURIComponent(text);
        fetch(url2)
          .then(function(r) { return r.json(); })
          .then(function(d) {
            try { cb(null, d[0][0][0]); }
            catch (err) { cb(err, null); }
          })
          .catch(function(e2) { cb(e2, null); });
      });
  }

  // 全局函数：点击翻译按钮时调用
  window.showTransInline = function(el) {
    if (el.classList.contains("translated")) return;
    var text = el.getAttribute("data-en");
    if (!text) return;
    el.textContent = "翻译中…";
    translateText(text, function(err, result) {
      if (err) {
        el.textContent = "翻译失败";
      } else {
        el.textContent = result;
        el.classList.add("translated");
      }
    });
  };
</script>
</body>
</html>
