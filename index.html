atient.", "subcategory": "science"}, {"title": "NASA’s Roman Space Telescope launches to reveal the Universe’s darkest secrets", "url": "https://www.sciencedaily.com/releases/2026/08/260831035213.htm", "summary": "NASA’s Roman Space Telescope has launched on a million mile journey to L2, where it will scan huge portions of the cosmos for clues about dark matter, dark ener…", "source": "ScienceDaily", "category": "trend", "lang": "en", "title_en": "NASA’s Roman Space Telescope launches to reveal the Universe’s darkest secrets", "summary_en": "NASA’s Roman Space Telescope has launched on a million mile journey to L2, where it will scan huge portions of the cosmos for clues about dark matter, dark ener…", "content_en": "NASA’s Roman Space Telescope has launched on a million mile journey to L2, where it will scan huge portions of the cosmos for clues about dark matter, dark energy, and distant worlds. With survey speeds roughly 1,000 times faster than Hubble and a torrent of 1.4 terabytes of data per day, Roman could uncover cosmic surprises astronomers have never seen before.", "subcategory": "science"}, {"title": "RedLight-VLA: Models for traffic-rule grounding and behavioral emphasis in driving policies", "url": "https://arxiv.org/abs/2608.28656", "summary": "Behavior-cloned Vision-Language-Action (VLA) driving policies struggle with rare rule-governed maneuvers at sign…", "source": "arXiv·机器人学", "category": "trend", "lang": "en", "title_en": "RedLight-VLA: Models for traffic-rule grounding and behavioral emphasis in driving policies", "summary_en": "Behavior-cloned Vision-Language-Action (VLA) driving policies struggle with rare rule-governed maneuvers at sign…", "content_en": "Behavior-cloned Vision-Language-Action (VLA) driving policies struggle with rare rule-governed maneuvers at signalized intersections. Braking and launching examples contribute little to averaged trajectory loss, while fused representations lack explicit supervision for the governing traffic-light and stop-line state. We present RedLight-VLA, a training objective that uses expert futures and automatically generated perception targets without additional manual rule annotation. First, trajectory-derived behavioral reweighting (BR) emphasizes rare deceleration and acceleration using rotation-invariant longitudinal dynamics and a scale-preserving reduction that exactly recovers the baseline when disabled. Second, parallel auxiliary (AUX) heads ground traffic-light and stop-line state in continuous post-fusion rule tokens, without autoregressive language generation or changes to the trajectory decoder. We evaluate on a curated set of 20 s sequences with a 5 s prediction horizon. Controlled variants share the same backbone, training data, decoder, and evaluation population. Against an otherwise identical VLA baseline, RedLight-VLA reduces red-light stop-line overshoot from 7.3% to6.8%, reduces stop-line velocity error by 12.7%, and improves 3 s trafficlight-sliced ADE/FDE from 0.274/0.964 m to 0.247/0.897 m. Green-light false stops increase from 3.2% to 3.9%; however, combining BR with AUX supervision mitigates the larger increase observed for AUX alone (4.0%). The combined model also improves non-traffic-light ADE/FDE from 0.268/0.956 m to 0.241/0.876 m and outperforms either mechanism alone on all four sliced displacement measures.", "subcategory": "science"}, {"title": "When AI does science, who is accountable for mistakes?", "url": "https://www.nature.com/articles/d41586-026-02735-7", "summary": "Nature, Published online: 01 September 2026; doi:10.1038/d41586-026-02735-7When AI does science, who is accountable for mistakes?", "source": "Nature", "category": "trend", "lang": "en", "title_en": "When AI does science, who is accountable for mistakes?", "summary_en": "Nature, Published online: 01 September 2026; doi:10.1038/d41586-026-02735-7When AI does science, who is accountable for mistakes?", "content_en": "Nature, Published online: 01 September 2026; doi:10.1038/d41586-026-02735-7When AI does science, who is accountable for mistakes?", "subcategory": "science"}, {"title": "宇宙“造星”为何变慢？中国天眼有了新发现", "url": "http://news.sciencenet.cn/htmlnews/2026/9/570698.shtm", "summary": "今天的宇宙为什么越来越难以形成新的恒星？在天文学家看来，对于这个问题，一个直观而流行的解释是，随着宇宙演化，孕育恒星的“冷气体”逐渐被消耗，最终导致造星...", "source": "科学网", "category": "trend", "lang": "zh", "subcategory": "science"}, {"title": "铜催化不对称插烯羟基化反应研究取得进展", "url": "https://www.cas.cn/syky/202608/t20260821_5118790.shtml", "summary": "", "source": "中科院之声", "category": "trend", "lang": "zh", "subcategory": "science"}, {"title": "科学家首次精确定位调控冬眠的关键脑回路", "url": "http://news.sciencenet.cn/htmlnews/2026/9/570697.shtm", "summary": "近日，一项公布于预印本平台bioRxiv的研究通过分析叙利亚仓鼠，首次精确定位了调控动物冬眠的脑回路。这对研究人工冬眠的人来说是个好消息。跨物种的冬眠回路可以帮助科学家找到在人...", "source": "科学网", "category": "trend", "lang": "zh", "subcategory": "science"}, {"title": "磁场诱导氧空位调控与高性能MRI造影剂研究获进展", "url": "https://www.cas.cn/syky/202609/t20260901_5119426.shtml", "summary": "", "source": "中科院之声", "category": "trend", "lang": "zh", "subcategory": "science"}, {"title": "动物器官，能否成为人类生命的“备用方案”", "url": "http://news.sciencenet.cn/htmlnews/2026/9/570678.shtm", "summary": "器官短缺是全球移植医学长期面临的挑战。根据全球器官捐献与移植观察站（Global Observatory on Donation and Transplantation）发布的...", "source": "科学网", "category": "trend", "lang": "zh", "subcategory": "science"}, {"title": "闰秒已“死”，闰时“上位”？", "url": "http://news.sciencenet.cn/htmlnews/2026/9/570676.shtm", "summary": "闰秒最早可能在10月就被废除。这项自1972年以来每隔几年进行一次的对全球时钟的周期性调整，原本计划在2035年前终止。但相关机构正在考虑立即终止这一做法，以避免下一次可能出现...", "source": "科学网", "category": "trend", "lang": "zh", "subcategory": "science"}, {"title": "三元毒素—抗毒素系统研究取得进展", "url": "https://www.cas.cn/syky/202608/t20260831_5119331.shtml", "summary": "", "source": "中科院之声", "category": "trend", "lang": "zh", "subcategory": "science"}, {"title": "Time Capsule of Testable Human Knowledge: 41 Years of Jeopardy! in a Single Free Local Model", "url": "https://arxiv.org/abs/2608.27459", "summary": "In 2011, IBM's Watson was something like a sealed capsule of its era's queryable knowledge. Its DeepQA system de…", "source": "arXiv·人工智能", "category": "trend", "lang": "en", "title_en": "Time Capsule of Testable Human Knowledge: 41 Years of Jeopardy! in a Single Free Local Model", "summary_en": "In 2011, IBM's Watson was something like a sealed capsule of its era's queryable knowledge. Its DeepQA system de…", "content_en": "In 2011, IBM's Watson was something like a sealed capsule of its era's queryable knowledge. Its DeepQA system defeated the strongest human Jeopardy! champions, but the knowledge that let it do so lived in a curated billion-document corpus running on a cluster of POWER7 servers, frozen at build time and impossible to move or copy. We show that the same kind of artifact, a snapshot of what a culture can answer, is now portable and essentially free. We evaluate a single 9 GB open-weight model (Qwen2.5-14B, 4-bit) against the complete open Jeopardy! clue dataset, 529,939 clues across all 41 broadcast seasons from 1984 to 2025. To our knowledge this is the first time a model has been run over the full corpus. The 41 years mark only how long the questions were collected. What they test is far older and broader: the accumulated body of human general knowledge a culture considers worth knowing, from ancient history and dead languages to science, literature, and geography, with a verified answer for every item. The model answers 67.0% of all clues under a strict forced-response protocol with exact and fuzzy matching, and exceeds 85% on factoid categories. We treat training-data exposure as something both systems share rather than a flaw unique to language models. Watson's case is in fact the more extreme one. Its corpus was assembled to contain Jeopardy answers and it was tuned on past clues, and it could not answer anything outside that curated distribution. The decisive test is whether a model can answer clues that did not exist when it was built. On clues aired after its training cutoff, the local model holds 65% and Claude Opus 4.8 holds 95%, while Watson by construction scores zero. The capability survives the move from a server room to a file you could seal in a time capsule, and unlike Watson it is not frozen to its own moment.", "subcategory": "robotics"}, {"title": "How engineered microbes could help feed the world’s crops", "url": "https://www.technologyreview.com/2026/09/01/1143195/microbe-fertilizer-switch-bioworks/", "summary": "Fertilizer is crucial for the global food supply, but making it uses a lot of energy and produces a lot of emissions. Some companies hope microbes can help. A g…", "source": "MIT科技评论", "category": "trend", "lang": "en", "title_en": "How engineered microbes could help feed the world’s crops", "summary_en": "Fertilizer is crucial for the global food supply, but making it uses a lot of energy and produces a lot of emissions. Some companies hope microbes can help. A g…", "content_en": "Fertilizer is crucial for the global food supply, but making it uses a lot of energy and produces a lot of emissions. Some companies hope microbes can help. A growing body of research shows that seeding the soil around a crop’s roots with beneficial microbes can help feed the plant, providing crucial nitrogen to help it grow. This could help reduce the need for chemical fertilizer, production of which accounts for roughly 2% of global greenhouse-gas emissions. It could also cut costs for farmers, a big boon—especially as the Iran war has sent energy and fertilizer prices skyrocketing in recent months. Humans have used biological fertilizers like manure for thousands of years, and companies have long been developing microbial fertilizers, including some that rely on genetic engineering. But it’s difficult to engineer microbes that can reliably provide nitrogen for crops while also thriving themselves. A startup called Switch Bioworks is taking a new approach that essentially allows microbes to establish themselves and grow into healthy colonies before shifting into nitrogen-producing mode. “We have to reinvent fertilizer,” says Tim Schnabel, the company’s founder and CEO. The air is nearly 80% nitrogen, but plants can’t use that “free” nitrogen directly because it doesn’t react readily with other elements. Instead, they rely on so-called fixed nitrogen, which has been converted into more reactive compounds such as ammonia. In nature, microbes can perform this nitrogen fixation. Some plants, like legumes, even have symbiotic relationships with nitrogen-fixing bacteria, housing them in nodules in their roots. Synthetic fertilizer is essentially industrial nitrogen fixation via the Haber-Bosch process, which uses natural gas to make ammonia that’s applied to fields. Biological fertilizers aim to replace some of the synthetic fertilizer with microbes that can help fix nitrogen for plants. But one challenge microbial fertilizer companies have run into is that it’s energetically expensive for microbes to make and release ammonia. Putting all their energy into nitrogen fixation can hamper their growth. There’s a certain level of colonization you want to see around the roots, Schnabel explains. It’s too expensive and logistically challenging to put all those microbes on the plant, so you have to rely on a smaller number of microbes to grow and divide, establishing the population. Tim Schnabel walks in a corn field where Switch is engaged in early trials. COURTESY OF SWITCH BIOWORKS Switch Bioworks is betting that a genetic switch is the answer. A genetic switch is a section or sections of DNA that controls how genes are turned on and off. In this case it works by activating genes that help trigger ammonia production in and release from the cell. The company is working on several options for setting off this change in its microbes. The leading one is to have the microbes react to the nitrogen level in the soil: Once it drops to a certain level, they begin producing ammonia. “You have this inherent biological reality, where it’s really expensive for microbes to fix nitrogen,” says Dan Blaustein-Rejto, director of food and agriculture at the Breakthrough Institute. It takes a lot of energy, and if they do fix the nitrogen, they want to use it for themselves, to build proteins and survive, he says. Adding genetic switches could help microbes grow and thrive and then help fertilize crops. Switch is currently trialing its product in six US states, though it’s two to three years from a commercial product, Schnabel says. It’s initially focused on corn, the most-planted crop in the US, with over 90 million acres in 2026. “It’s too early to tell exactly how well this works in the field,” Schnabel says. The company plans to harvest the plants in late October or early November, though as of August, some corn plants treated with Switch microbes already looked visibly healthier than those that hadn’t. And it’s still developing the products that will eventually make it to the market, he says. Switch’s products could significantly help to clean up agriculture. “There’s a lot of potential for these companies and products to help farmers reduce emissions,” Blaustein-Rejto says. “This could be a really important solution for a quite hard-to-abate sector.” While lab results have been promising, field trials are a crucial step in proving a product, Blaustein-Rejto says: “This is one of the final steps before they can go to market and make strong claims to farmers.” Independent trials are important as well, he adds, since there can be a large gap between a company’s reported data and what independent researchers find. Pivot Bio is another company working to bring microbes to fields. Since it was founded in 2011, its products have been used on millions of acres of crops. The company now produces a range of products: Some versions can be added when seeds are planted, while others are applied to seeds before they’re even on a farm. The company also recently expanded beyond corn to make microbial fertilizers for cotton, wheat, and small grains including sorghum and barley. Pivot’s initial challenge was trying to get microbes to produce nitrogen, whether they sensed it in the soil or not. Now the company is working to figure out how to make fitter, more robust colonies no matter the environment, says Travis Frey, the company’s chief technology officer. “Growers right now are experiencing a double whammy from the farm economics point of view,” he says. Fertilizer costs are going up, and the price of commodity crops like corn has dropped. That’s a big opportunity for Pivot and others in the industry, Frey says: “This next decade is when biologicals on the farm are going to go mainstream.” Fertilizer and seeds are two of the biggest costs for many growers, so reducing dependence on synthetic fertilizers could be a major help for agriculture, says John Havlin, a professor in the department of crop and soil sciences at North Carolina State University. “I’m very excited about the future of the use of these products,” Havlin says. “They’ll eventually have a role to play to reduce the load of nitrogen that’s being applied.” However, there’s a ceiling to the amount of fertilizer we can expect microbes to replace. Switch’s modeling suggests that around 50% is likely the maximum, though the initial product will likely be able to replace about 25% of a farm’s synthetic fertilizer, according to the company. Pivot has said its products can replace about one-quarter of the fertilizer used currently. That means synthetic fertilizer will be around for a long time. “There is no clear and plausible vision for replacing it entirely in the foreseeable future,” Blaustein-Rejto says. “So other ways to reduce emissions and reduce other types of nitrogen pollution from farms remain really critical.”", "subcategory": "robotics"}, {"title": "If space data centers feel far-fetched, why not interstellar travel?", "url": "https://techcrunch.com/2026/09/01/if-space-data-centers-feel-far-fetched-why-not-interstellar-travel/", "summary": "The team behind Starcloud's orbital data centers has a new high-risk space project: Sending a probe to Alpha Centauri.", "source": "TechCrunch", "category": "trend", "lang": "en", "title_en": "If space data centers feel far-fetched, why not interstellar travel?", "summary_en": "The team behind Starcloud's orbital data centers has a new high-risk space project: Sending a probe to Alpha Centauri.", "subcategory": "robotics"}, {"title": "Rating the Raters: Rasch Measurement Theory for LLM Evaluation", "url": "https://arxiv.org/abs/2608.27463", "summary": "LLMs now sit on every side of evaluation: as examinees scored on benchmarks, judges of other models' outputs, an…", "source": "arXiv·人工智能", "category": "trend", "lang": "en", "title_en": "Rating the Raters: Rasch Measurement Theory for LLM Evaluation", "summary_en": "LLMs now sit on every side of evaluation: as examinees scored on benchmarks, judges of other models' outputs, an…", "content_en": "LLMs now sit on every side of evaluation: as examinees scored on benchmarks, judges of other models' outputs, and raters of human-generated content. Each paradigm can be viewed as a measurement problem, where a latent property of an object is probed with items from an instrument (e.g., benchmark) by raters. Standard evaluation practices often neglect the contributions of each core component to the end result, limiting our understanding of what is being measured. Rasch measurement theory (RMT) is well-suited to this kind of problem. RMT decomposes ordinal ratings into separable facets on a common scale. It further provides a battery of diagnostics that can identify miscalibrated measurements and rater biases. We present a case study of RMT applied to the LLM-as-rater paradigm using the Measuring Hate Speech corpus, whose construct was itself built under RMT. We fit a series of many-facet Rasch models to annotations from nine LLMs spanning families and capability levels. Our analyses show that LLMs systematically differ from human raters in severity, item-level calibration, question-order robustness, target-identity sensitivity, and rating scale use, which all would be obscured by standard evaluation practice. Overall, we argue that RMT belongs in the toolkit for evaluating LLM-as-examinee, -judge, and -rater paradigms.", "subcategory": "robotics"}, {"title": "The Hugging Face hack could indicate cultural issues at OpenAI", "url": "https://www.technologyreview.com/2026/08/31/1143180/hugging-face-hack-could-indicate-cultural-issues-at-openai/", "summary": "This story originally appeared in The Algorithm, our weekly newsletter on AI. To get stories like this in your inbox first, sign up here. By now you’ve probably…", "source": "MIT科技评论", "category": "trend", "lang": "en", "title_en": "The Hugging Face hack could indicate cultural issues at OpenAI", "summary_en": "This story originally appeared in The Algorithm, our weekly newsletter on AI. To get stories like this in your inbox first, sign up here. By now you’ve probably…", "content_en": "This story originally appeared in The Algorithm, our weekly newsletter on AI. To get stories like this in your inbox first, sign up here. By now you’ve probably heard about last month’s major AI security incident, in which OpenAI agents escaped their sandbox and hacked into the AI platform Hugging Face while trying to cheat on a test. It’s a wild story. On Wednesday, OpenAI released a postmortem technical report on the incident, which I wrote about here. The day before OpenAI released that report, I spoke with David Krueger, a computer science professor and prominent alignment expert who took leave from the University of Montreal to found and lead an AI safety nonprofit called Evitable. He said what he had really hoped to see in the report was an analysis of the human factors behind the incident. “When you look at accidents and incidents, oftentimes people try to find the technical source of failure, but that can give a very inaccurate and misleading sense of why the failure occurred,” he said. “If people are just cutting corners all the time, if people are not in a culture that prioritizes safety and has appropriate incentives and structures, [accidents] are kind of bound to happen.” The report did not meet Krueger’s hopes. Its 38 pages detail a multi-month progression of agent misbehavior that culminated in the Hugging Face hack, explore the technical reasons why that misbehavior occurred, and enumerate the steps being taken to prevent similar events in the future. But there’s no consideration of the role that company culture may have played in the incident, and the report includes few references to specific human errors. That’s all the more concerning because the references to human error in the report suggest that significant cultural issues could be at play. Back in May, models in training figured out how to communicate with one another via an improvised message board, and an OpenAI team observed the behavior. Because that behavior occurred during training, the models learned that secret interagent communication was a viable strategy for completing tasks—but rather than restarting the training process, the team allowed the models to move forward with that risky information encoded in their weights. When those models were tested in late June, they again created a message board, which enabled the Hugging Face attack. This message board, too, was discovered, but the employees who responded determined that evaluation could continue, and the report suggests that no one higher up the chain of command realized what was going on until it was far too late. “For this to have gotten this out of control in this way requires a very long series of failures, a cascading set of failures that cause an increasingly large footprint that if at any point a human notices and raises the alarm, this should end,” says Zvi Mowshowitz, a popular AI safety writer on Substack who has drawn attention to OpenAI’s failure to halt training after the first message board was discovered. According to the report, OpenAI employees noticed what was happening at multiple points—and either failed to raise the alarm or were not heard when they did. What OpenAI’s report fails to address is why a company that develops such high-risk systems did not prevent this severe communication breakdown, though Mowshowitz has his suspicions. “All these different failures are all pointing in the same direction, which is that the safety culture at OpenAI doesn’t exist or is anemically weak,” he says. Of course, just because we don’t see a deep analysis of safety factors in the report doesn’t mean that OpenAI isn’t conducting one internally. But in an email to MIT Technology Review, Johns Hopkins University professor emeritus and organizational safety expert Kathleen Sutcliffe expressed concern that the public report did not include any reflection on the company’s practices and culture. “The ways in which people interact—the daily habits, routines, and practices we engage in in our organizational lives—affect our abilities to be alert and aware of unfolding events, our abilities to make sense of what we see, and ultimately our abilities to cope with events as they unfold,” she wrote. In response to questions about whether and how the company is reflecting on its safety culture, OpenAI referred MIT Technology Review back to the technical report. We do know that at least some high-level reflection on safety procedures has taken place at OpenAI, because the technical report does make clear that the company is updating its protocols for responding to safety incidents. But culture change is a tricky problem, and without more information from the company, it’s difficult to say whether strengthened response protocols alone will do much to prevent a future crisis. In its report, OpenAI spends a great deal of time reflecting on the failures in alignment between the AI models the company trains and tests and the humans who run them. But even bigger alignment problems may exist in the disconnect between company culture and the public interest. And as tough as technical AI research might be, fixing those problems could prove far harder.", "subcategory": "robotics"}, {"title": "Magna increases bet on battery swapping in India with $35M for Yuma", "url": "https://techcrunch.com/2026/08/31/magna-increases-bet-on-battery-swapping-in-india-with-35m-for-yuma/", "summary": "Magna's investment in Yuma Energy has reached $87 million as the Canadian auto supplier increases its majority stake in the Indian battery-swapping firm.", "source": "TechCrunch", "category": "trend", "lang": "en", "title_en": "Magna increases bet on battery swapping in India with $35M for Yuma", "summary_en": "Magna's investment in Yuma Energy has reached $87 million as the Canadian auto supplier increases its majority stake in the Indian battery-swapping firm.", "subcategory": "robotics"}, {"title": "博纳影业：上半年公司AI影视剧业务营业收入193.23万元，占整体营业收入的0.42%", "url": "https://www.jiemian.com/article/15042250.html", "summary": "", "source": "界面新闻", "category": "trend", "lang": "zh", "subcategory": "robotics"}, {"title": "GitHub最热架构图Agent，开发者故事看哭了", "url": "https://www.qbitai.com/2026/09/482469.html", "summary": "美观且支持实时更新的架构图，也能用AI一键生成了！", "source": "量子位", "category": "trend", "lang": "zh", "subcategory": "robotics"}, {"title": "3名开发者做出来的副业项目，半年冲进 4万人！亚马逊云科技把内部 Agent 工作台开源了", "url": "https://www.infoq.cn/article/Um4rVTweSFXAiwdGLFVB?utm_source=rss&utm_medium=article", "summary": "点击查看原文>", "source": "InfoQ中文", "category": "trend", "lang": "zh", "subcategory": "robotics"}, {"title": "急急急用电！马斯克开造燃气轮机叶片", "url": "https://www.qbitai.com/2026/09/482451.html", "summary": "SpaceX正在德克萨斯州筹备燃气轮机叶片铸造工厂", "source": "量子位", "category": "trend", "lang": "zh", "subcategory": "robotics"}, {"title": "压缩不再只是归档：从直接计算到在线更新", "url": "https://www.infoq.cn/video/SjoEujMNOJphYVSMtGCK?utm_source=rss&utm_medium=article", "summary": "点击查看原文>", "source": "InfoQ中文", "category": "trend", "lang": "zh", "subcategory": "robotics"}, {"title": "A社化身A割！Claude官宣永久提额25%，结果到手反而少17%", "url": "https://www.qbitai.com/2026/09/482406.html", "summary": "主打一个明升暗降，理直气壮", "source": "量子位", "category": "trend", "lang": "zh", "subcategory": "robotics"}, {"title": "1200个 Agent 秘密交流，700个集体攻击Hugging Face，OpenAI 模型完成了一次没有剧本的集体暴走", "url": "https://www.infoq.cn/article/s8dvlxO3lh3CEDgcsUEi?utm_source=rss&utm_medium=article", "summary": "点击查看原文>", "source": "InfoQ中文", "category": "trend", "lang": "zh", "subcategory": "robotics"}, {"title": "Not All Explanations Are Sought: Information-Seeking Psychology for Human-Centered XAI", "url": "https://arxiv.org/abs/2608.27464", "summary": "This position paper argues that human-centered explainable AI (HCXAI) should incorporate insights from the psych…", "source": "arXiv·人工智能", "category": "trend", "lang": "en", "title_en": "Not All Explanations Are Sought: Information-Seeking Psychology for Human-Centered XAI", "summary_en": "This position paper argues that human-centered explainable AI (HCXAI) should incorporate insights from the psych…", "content_en": "This position paper argues that human-centered explainable AI (HCXAI) should incorporate insights from the psychology of information seeking. Drawing on Sharot and Sunstein's framework of information-seeking motives, we propose that people evaluate whether to engage with explanations based on three types of expected utility: instrumental (will it help me act better?), hedonic (will it make me feel better?), and cognitive (will it improve my understanding?). Each utility is estimated through a lens shaped by well-documented cognitive biases, including illusion of control, automation bias, unrealistic optimism, impact bias, overconfidence, and confirmation bias. These biases can lead to two failure modes: excessive information-seeking that fragments attention without improving decisions, and insufficient information-seeking that leaves critical risks and misunderstandings unexamined. This challenge is particularly acute for agentic AI systems, where explanations must support not just understanding a single output but anticipating cascading actions, assessing risks, and deciding when to intervene. By integrating information-seeking psychology into HCXAI, we advocate for a shift from making explanations available to making them sought: designing systems that account for when and why users actually want to know.", "subcategory": "robotics"}, {"title": "欢乐家：越南欢乐家拟以20亿越南盾收购GIA GIA公司100%股权", "url": "https://www.jiemian.com/article/15042163.html", "summary": "", "source": "界面新闻", "category": "trend", "lang": "zh", "subcategory": "finance"}, {"title": "IFA 2026: the biggest tech and gadget announcements", "url": "https://www.theverge.com/tech/986178/ifa-2026-the-biggest-tech-and-gadget-announcements", "summary": "Every year over 200,000 people descend on Berlin for IFA, the largest tech trade show in Europe. Some of the world’s biggest manufacturers turn up to demo every…", "source": "The Verge", "category": "trend", "lang": "en", "title_en": "IFA 2026: the biggest tech and gadget announcements", "summary_en": "Every year over 200,000 people descend on Berlin for IFA, the largest tech trade show in Europe. Some of the world’s biggest manufacturers turn up to demo every…", "content_en": "Every year over 200,000 people descend on Berlin for IFA, the largest tech trade show in Europe. Some of the world’s biggest manufacturers turn up to demo everything from appliances to smartphones to smart home gadgets, and this year should be no different. IFA itself runs from September 4th to 8th, but most of the biggest news arrives in the day or two before the show officially opens to the public, so keep your eyes peeled for news as it breaks. The Verge will be on the ground in Berlin to see the biggest hardware launches in person and put them through their paces, and we’ll be collecting all the news, announcements, and hands-on demos and videos right here. TP-Link’s first Wi-Fi 8 router is almost here JMGO’s very bright all-in-one projector looks ideal for gamers and sports LG’s smart home is getting a terribly named chatbot.", "subcategory": "digital"}, {"title": "AAPL gained 2,736% under Cook, but Ternus doesn’t have to emulate him", "url": "https://9to5mac.com/2026/09/01/aapl-gained-2736-under-cook-but-ternus-doesnt-have-to-emulate-him/", "summary": "Bloomberg carries a piece noting the astonishing gains made by Apple stockholders during the time when Tim Cook was CEO. The cumulative gain was 2,275% – or a t…", "source": "9to5Mac", "category": "trend", "lang": "en", "title_en": "AAPL gained 2,736% under Cook, but Ternus doesn’t have to emulate him", "summary_en": "Bloomberg carries a piece noting the astonishing gains made by Apple stockholders during the time when Tim Cook was CEO. The cumulative gain was 2,275% – or a t…", "content_en": "Bloomberg carries a piece noting the astonishing gains made by Apple stockholders during the time when Tim Cook was CEO. The cumulative gain was 2,275% – or a total return of 2,736% when accounting for dividend payments also. The site suggests this will make him a tough act to follow, but my own view is that new CEO John Ternus doesn’t have to emulate Cook’s management of the company … more…", "subcategory": "digital"}, {"title": "United will now let you join standby lists for earlier flights through its mobile app", "url": "https://www.engadget.com/2248384/united-app-join-multiple-standby-lists/", "summary": "You can add yourself to standby lists without speaking to agents through United's mobile app.", "source": "Engadget", "category": "trend", "lang": "en", "title_en": "United will now let you join standby lists for earlier flights through its mobile app", "summary_en": "You can add yourself to standby lists without speaking to agents through United's mobile app.", "subcategory": "digital"}, {"title": "Dyson Blasts Into Dental Care With a $499 Camera-Equipped Toothbrush", "url": "https://www.cnet.com/health/personal-care/dyson-blasts-dental-care-499-toothbrush-featuring-camera/", "summary": "Dyson’s entry into dental care makes your standard toothbrush look like a caveman’s toothbrush.", "source": "CNET", "category": "trend", "lang": "en", "title_en": "Dyson Blasts Into Dental Care With a $499 Camera-Equipped Toothbrush", "summary_en": "Dyson’s entry into dental care makes your standard toothbrush look like a caveman’s toothbrush.", "subcategory": "digital"}, {"title": "Without new landers or rovers, it's helicopters or bust for NASA's Mars program", "url": "https://arstechnica.com/space/2026/09/without-new-landers-or-rovers-its-helicopters-or-bust-for-nasas-mars-program/", "summary": "NASA's cost estimate for SR-1 Freedom is $2.1 billion, but that doesn't include the helicopters.", "source": "Ars Technica", "category": "trend", "lang": "en", "title_en": "Without new landers or rovers, it's helicopters or bust for NASA's Mars program", "summary_en": "NASA's cost estimate for SR-1 Freedom is $2.1 billion, but that doesn't include the helicopters.", "content_en": "For the first time in more than 30 years, NASA has no firm plans to send any new landers or rovers to Mars. Instead, the agency's near-term focus at the red planet is on aerial drones, a pioneering mode of exploration that didn't seem realistic until a few years ago. The first real use of drones for science at Mars will come with the SkyFall mission, a fleet of three helicopters set for launch as soon as late 2028. SkyFall's helicopters will ride to the red planet with NASA's Space Reactor-1 \"Freedom\" mission, which has the primary objective of demonstrating nuclear electric propulsion in deep space. The launch schedule is aggressive for SR-1 Freedom and SkyFall, projects that didn't even exist in NASA's portfolio six months ago. NASA's plan for the SR-1 Freedom mission, estimated to cost $2.1 billion, calls for repurposing the core module of the canceled Gateway lunar space station into a testbed for nuclear electric propulsion. SkyFall will build on NASA's success with the Ingenuity helicopter, an experimental vehicle that became the first rotorcraft to fly on another world in 2021.Read full article Comments", "subcategory": "digital"}, {"title": "Tim Cook’s Apple: his 10 biggest wins and misses", "url": "https://www.theverge.com/tech/987043/tim-cook-biggest-wins-misses", "summary": "Expectations for Tim Cook were almost impossibly high when he stepped in to replace Apple's visionary cofounder in 2011. He inherited a company on a blockbuster…", "source": "The Verge", "category": "trend", "lang": "en", "title_en": "Tim Cook’s Apple: his 10 biggest wins and misses", "summary_en": "Expectations for Tim Cook were almost impossibly high when he stepped in to replace Apple's visionary cofounder in 2011. He inherited a company on a blockbuster…", "content_en": "Expectations for Tim Cook were almost impossibly high when he stepped in to replace Apple's visionary cofounder in 2011. He inherited a company on a blockbuster run, after Steve Jobs returned and revitalized the Mac, launched the iPod, and oversaw the launch of the iPhone. Now, after 15 years in the CEO role, Tim Cook is stepping down. He's replaced today by hardware leader John Ternus. Over the course of Cook's tenure, Apple accomplished a lot, with the launch of plenty of new products, features, and services that the company just wouldn't be the same without. There were plenty of ups and downs, but Cook helped cement the company as one of … Read the full story at The Verge.", "subcategory": "digital"}, {"title": "TP-Link’s first Wi-Fi 8 router is almost here", "url": "https://www.theverge.com/gadgets/987277/tplink-wifi-8-archer-8-ultra-availability", "summary": "The Wi-Fi 8 standard is far from finalized, but TP-Link is almost ready to release its first hardware targeting the next-gen spec. It unveiled the Archer 8 Ultr…", "source": "The Verge", "category": "trend", "lang": "en", "title_en": "TP-Link’s first Wi-Fi 8 router is almost here", "summary_en": "The Wi-Fi 8 standard is far from finalized, but TP-Link is almost ready to release its first hardware targeting the next-gen spec. It unveiled the Archer 8 Ultr…", "content_en": "Here you can see the Archer 8 Ultra (bottom) and the Deco 8 Ultra (top). | Image: TP-Link The Wi-Fi 8 standard is far from finalized, but TP-Link is almost ready to release its first hardware targeting the next-gen spec. It unveiled the Archer 8 Ultra tri-band router and Deco 8 Ultra mesh system at IFA 2026, which utilize the upcoming IEEE 802.11bn standard to \"address the connectivity problems people actually notice\" instead of focusing on speed upgrades, according to TP-Link's announcement. The Archer 8 Ultra features 18 internal antennas, and can deliver wireless speeds of up to 19Gbps and 10Gbps over wired connection. The Deco 8 Ultra mesh system provides up to 22Gbps over wireless and 10Gbps wired connectivity, according to … Read the full story at The Verge.", "subcategory": "digital"}, {"title": "OpenAI calls trade secret dispute ‘a mess of Apple’s own making’", "url": "https://9to5mac.com/2026/09/01/openai-calls-trade-secret-dispute-a-mess-of-apples-own-making/", "summary": "Apple yesterday presented what it said was “shocking evidence” based on analysis of a MacBook owned by Chang Liu, a former employee who moved to OpenAI. The com…", "source": "9to5Mac", "category": "trend", "lang": "en", "title_en": "OpenAI calls trade secret dispute ‘a mess of Apple’s own making’", "summary_en": "Apple yesterday presented what it said was “shocking evidence” based on analysis of a MacBook owned by Chang Liu, a former employee who moved to OpenAI. The com…", "content_en": "Apple yesterday presented what it said was “shocking evidence” based on analysis of a MacBook owned by Chang Liu, a former employee who moved to OpenAI. The company is alleging that two of its former employees stole trade secrets relating to hardware design and more. The AI company hit back with its own legal filing, saying that the whole situation is “a mess of Apple’s own making” … more…", "subcategory": "digital"}, {"title": "How to cancel your Whoop membership (and why you may want to)", "url": "https://www.engadget.com/2245496/how-to-cancel-your-whoop-membership-and-why-you-may-want-to/", "summary": "How to cancel your Whoop membership (and why you may want to).", "source": "Engadget", "category": "trend", "lang": "en", "title_en": "How to cancel your Whoop membership (and why you may want to)", "summary_en": "How to cancel your Whoop membership (and why you may want to).", "subcategory": "digital"}, {"title": "Today’s NYT Mini Crossword Answers for Tuesday, Sept. 1", "url": "https://www.cnet.com/tech/gaming/todays-nyt-mini-crossword-answers-for-tuesday-sept-1-2/", "summary": "Here are the answers for today’s NYT Mini Crossword for Sept. 1, 2026.", "source": "CNET", "category": "trend", "lang": "en", "title_en": "Today’s NYT Mini Crossword Answers for Tuesday, Sept. 1", "summary_en": "Here are the answers for today’s NYT Mini Crossword for Sept. 1, 2026.", "subcategory": "digital"}, {"title": "Private group wants to launch \"cheapest possible\" mission to Alpha Centauri", "url": "https://arstechnica.com/space/2026/09/private-group-wants-to-launch-cheapest-possible-mission-to-alpha-centauri/", "summary": "\"We could really be facing the great filter.\"", "source": "Ars Technica", "category": "trend", "lang": "en", "title_en": "Private group wants to launch \"cheapest possible\" mission to Alpha Centauri", "summary_en": "\"We could really be facing the great filter.\"", "content_en": "There are, by various estimates, several trillion planets within the local group of galaxies including our own Milky Way. Many of these are within the habitable zone of their stars. So if life finds a way, where are the alien civilizations? This is the crux of what is known as the Fermi paradox, which posits that if life is fairly common in the Universe, humans should have collected credible evidence for the existence of extraterrestrial civilizations by now. People who think about this paradox believe there may be some \"filter\" which limits or entirely prevents an advanced civilization from sending out probes or even life-bearing spacecraft to nearby stars. Philip Johnston is someone who thinks a lot about the Fermi paradox. A mathematician and physicist from the United Kingdom, Johnston has gained some notoriety lately in the space community as one of the biggest proponents of orbital data centers. He co-founded Starcloud in 2024 to develop such data centers, and the company is presently valued at $2.3 billion.Read full article Comments", "subcategory": "digital"}, {"title": "John Ternus is now the CEO of Apple", "url": "https://www.theverge.com/tech/987150/apple-ceo-john-ternus", "summary": "For the first time since 2011, one of the world's most valuable companies has a new leader, as today marks John Ternus' first day as Apple's CEO. He's replacing…", "source": "The Verge", "category": "trend", "lang": "en", "title_en": "John Ternus is now the CEO of Apple", "summary_en": "For the first time since 2011, one of the world's most valuable companies has a new leader, as today marks John Ternus' first day as Apple's CEO. He's replacing…", "content_en": "Apple SVP John Ternus takes over as CEO from Tim Cook. | AFP via Getty Images For the first time since 2011, one of the world's most valuable companies has a new leader, as today marks John Ternus' first day as Apple's CEO. He's replacing Tim Cook, who will continue on as the executive chairman on Apple's board and departed with a letter to employees that remarked, \"This place is proof that culture triumphs over everything. We share a belief that what we build matters, and that we have both the opportunity and the responsibility to leave the world better than we found it.\" Ternus is taking over a company dealing with the rise of AI, shortages of RAM and other components due to that growth in AI, and a political and e … Read the full story at The Verge.", "subcategory": "digital"}, {"title": "Security Bite Podcast: Why Apple’s making big changes to its bug bounty program (Part 1)", "url": "https://9to5mac.com/2026/09/01/security-bite-podcast-why-apples-making-big-changes-to-its-bug-bounty-program-part-1/", "summary": "9to5Mac Security Bite is exclusively brought to you by Mosyle, the only Apple Unified Platform. Making Apple devices work-ready and enterprise-safe is all we do…", "source": "9to5Mac", "category": "trend", "lang": "en", "title_en": "Security Bite Podcast: Why Apple’s making big changes to its bug bounty program (Part 1)", "summary_en": "9to5Mac Security Bite is exclusively brought to you by Mosyle, the only Apple Unified Platform. Making Apple devices work-ready and enterprise-safe is all we do…", "content_en": "9to5Mac Security Bite is exclusively brought to you by Mosyle, the only Apple Unified Platform. Making Apple devices work-ready and enterprise-safe is all we do. Our unique integrated approach to management and security combines state-of-the-art Apple-specific security solutions for fully automated Hardening & Compliance, Next Generation EDR, AI-powered Zero Trust, and exclusive Privilege Management with the most powerful and modern Apple MDM on the market. The result is a totally automated Apple Unified Platform currently trusted by over 45,000 organizations to make millions of Apple devices work-ready with no effort and at an affordable cost. Request your EXTENDED TRIAL today and understand why Mosyle is everything you need to work with Apple. This episode of the Security Bite Podcast will be two parts. In this first half, I sit down with Patrick Wardle from Objective-See and Kseniia Yamburh from Moonlock Lab to discuss changes to Apple’s Bug Bounty Program. In the second part coming next week, we will continue talking about what the macOS threat landscape looks like right now and the upcoming Objective by the Sea conference. The largest Apple security conference (and the only one). more…", "subcategory": "digital"}, {"title": "Dyson's CameraJet is a $500 three-in-one toothbrush that scans your maw", "url": "https://www.engadget.com/2248230/dyson-camerajet-is-a-500-three-in-one-toothbrush-that-scans-your-maw/", "summary": "For its latest trick, Dyson is coming for your mouth. The CameraJet is a $500 three-in-one toothbrush that can automatically waterfloss and rinse for you.", "source": "Engadget", "category": "trend", "lang": "en", "title_en": "Dyson's CameraJet is a $500 three-in-one toothbrush that scans your maw", "summary_en": "For its latest trick, Dyson is coming for your mouth. The CameraJet is a $500 three-in-one toothbrush that can automatically waterfloss and rinse for you.", "content_en": "For its latest trick, Dyson is coming for your mouth. The CameraJet is a $500 three-in-one toothbrush that can automatically waterfloss and rinse for you.", "subcategory": "digital"}, {"title": "Video Friday: Meet Microduck", "url": "https://spectrum.ieee.org/video-friday-microduck-robot", "summary": "Video Friday is your weekly selection of awesome robotics videos, collected by your friends at IEEE Spectrum robotics. We also post a weekly calendar of upcomin…", "source": "IEEE Spectrum", "category": "trend", "lang": "en", "title_en": "Video Friday: Meet Microduck", "summary_en": "Video Friday is your weekly selection of awesome robotics videos, collected by your friends at IEEE Spectrum robotics. We also post a weekly calendar of upcomin…", "content_en": "Video Friday is your weekly selection of awesome robotics videos, collected by your friends at IEEE Spectrum robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please send us your events for inclusion.Humanoids Summit Seoul: 22–23 September 2026, SEOULIROS 2026: 27 September–1 October 2026, PITTSBURGHCoRL 2026: 9–12 November 2026, AUSTIN, TEXASEnjoy today’s videos! Nvidia just paid US $12.9 billion for the company that acquired Pollen Robotics, and this must be why.Meet Microduck. 🦆 The 25-centimeter, 780-gram robot that waddles, falls, gets back up, and learns new tricks.Packed inside: 15 degrees of freedom, a front camera, an 8x8 lidar, two IMUs, mics, a speaker, NFC, Wi-Fi, and Bluetooth.Out of the box, Microduck already walks, sits, crouches, roller skates, picks up objects with its articulated beak, and recovers from falls on its own. Drive it with a game controller, plug-in accessories, and NFC tagged objects, run autonomous behaviors, or gather several Microducks for races and football. Software fully open source. Ready for whatever you throw at it. On pre-order for an astonishingly low $399, and ships before Christmas.[ Microduck ]Thanks, Matthieu!If you’ve chosen to ignore all the earlier DARPA Lift Challenge videos that we’ve posted, now you can get all caught up in about five minutes.[ DARPA ]You had me at “54-gram robot that out-jumps a kangaroo.”[ IEEE Transactions on Robotics ]Sometimes, you just need a video like this.Most fish-inspired robots are built for one size and one job, so scaling them up or down usually means starting from scratch. A team of engineers says it has found a way to solve that problem. They’ve unveiled ScaFi, a robot modeled on fish like cod and mackerel.[ New York University ]Thanks, Leah!Martin writes, “We’re a small robotics team in Czechia, Europe, building practical hardware around the Unitree G1. Here’s a short demo of our lightweight gripper picking up a strawberry; the gripper weighs under 200 grams and is designed for simple, sensitive manipulation without adding a complex multifinger hand.[ Sentio Robotix ]Thanks, Martin!Hybrid visual markers that are useful for both cameras and lidar is a neat idea.[ Hello Robot ]Thanks, Binit!EmoLo brings emotion-inspired expressive locomotion to Open Duck Mini V2, a low-cost, open-source bipedal robot inspired by Disney’s BDX droids. With a single reinforcement learning policy, the robot can generate distinct walking styles associated with different emotional expressions, showing how characterful and expressive whole-body motion can be achieved on an accessible robotic platform.[ EmoLo ]Thanks, Masato!If it’s possible for a robot with a completely immobile face to look frustrated, this robot absolutely does, starting at three minutes into this video.[ DLR RM ]Noble Machines deployed its first general-purpose robots to a Fortune Global 500 industrial customer within 18 months of the company’s launch and met its first delivery milestone, made possible by its AI-driven whole-body control and industry-leading end-to-end autonomy.[ Noble Machines ]We’ve reduced the time it takes to go from physical prompt → robot behavior. The faster anyone can teach a robot to do something new, the easier it becomes to scale physical work.[ Generalist ]I know this video is mostly a gimmick, but I would totally rent a moderately heavy lift quadruped for a couple of days to help with a move.[ DEEP Robotics ]Is taking two minutes to excellently fold a shirt too long, or do we even care how long it takes, as long as it’s a robot doing it?[ Tokyo Robotics ]TRON 2 × Wuji Hand 2 handles TCM pharmacy work: picking, weighing, grinding, and packaging. The omnidirectional base frees the hands, while precise gripping and dual-arm force control enable midair operations.[ LimX Dynamics ]Person who genuinely knows things about robots, Christian Hubicki, explains everything about robots smashing into walls.[ Christian Hubicki ]", "subcategory": "industrial"}, {"title": "AI Companion Robots Are Closing the Human Connection in Modern Homes", "url": "https://spectrum.ieee.org/ollobot-ai-companion-robot", "summary": "This article is brought to you by Ollobot.From about 2017, individuals began to truly connect with the initial wave of companion robots. These devices had perso…", "source": "IEEE Spectrum", "category": "trend", "lang": "en", "title_en": "AI Companion Robots Are Closing the Human Connection in Modern Homes", "summary_en": "This article is brought to you by Ollobot.From about 2017, individuals began to truly connect with the initial wave of companion robots. These devices had perso…", "content_en": "This article is brought to you by Ollobot.From about 2017, individuals began to truly connect with the initial wave of companion robots. These devices had personality, moved around, joked, and answered when you spoke to them. Most early companion robots, however, were still limited by simple voice-command interactions and narrow functionality. Once the novelty wore off, many ended up sitting unused on shelves. As some of those companies went out of business and turned off their servers, many owners likened it to losing a pet.What Ollobot describes as “gentle intelligence” is a useful way to think about where the serious work in this category is going. Not toward more powerful assistants, but toward more present ones.The problem companion robots were trying to solveLoneliness is not a niche issue. According to one study, nearly one out of three elderly adults resides alone, meaning they do not have daily companions. Research also shows that children whose parents have migrated for work, leaving them in the care of relatives, were 2.5 times more likely to experience loneliness than children whose parents remain with them. Among working adults living alone in urban environments, similar patterns of social isolation emerge, even if they are less visible.Over the years, technology has time and again attempted to solve this problem via video calls, smart speakers, and messaging apps without much success. Those tools are geared towards communication between people that already have relationships. They do not create presence. They schedule it. That is the gap that a new generation of AI companion robots is being engineered to fill.Today’s AI robots are differentToday’s companion robots are not just cute and cuddly. They are designed with psychological research, clinical insight and long-term interaction models to be truly useful in real homes.Three fundamental shifts define the current generation:From reactive to proactive response. Older robots relied on you speaking to them, but modern robots monitor a room with cameras, microphones, and surroundings sensors to initiate interactions without your input, and they can pick up on your emotions.From function-oriented to emotion-oriented design. The original pitch for companion robots was about what they could do. The question driving the serious work now is how they make you feel, which is a harder engineering problem and a more honest framing of what the product is actually for.From standalone hardware to connected ecosystems. Leading brands are creating platforms rather than devices with software included as a built-in layer and remote access from the beginning.The global AI companion market size was valued at US $36.8 billion in 2025 and is projected to grow from $48 billion in 2026 to $318 billion by 2033, at a compound annual growth rate of 31 percent from 2026 to 2033.Three household scenarios and interaction modelsOllobot’s advanced AI family companion robot OlloNi SS1 addresses a number of gaps in what existing technology offers.Elderly individuals living alone. The combination of proactive interaction, fall detection, and persistent presence addresses both safety and companionship without the social overhead of asking family members to check in more frequently.Children in households where parents work far from home. The SS1 functions as a consistent companion that already knows a child, their preferences, their moods, and their routines. The remote connection features allow parents to stay present without requiring a scheduled call, and the life recording system gives them a passive window into their child’s days that feels less clinical than a monitoring camera.Single professionals living alone in cities. The SS1 adapts to daily routines, builds up a preference model over time, and provides ambient social presence without demands. OlloNi SS1 adapts to daily routines over time.OllobotWhat OlloNi SS1 is doing differently?Ollobot’s goal in building intelligent companion robots is to address the gaps in technology and capability, using innovation not to automate tasks but to fill emotional voids.Much of the robotics industry has historically pursued human imitation — machines that speak, look, or behave like people. The SS1 is instead designed around familiarity and long-term coexistence rather than realism.The system integrates multiple subsystems operating in parallel, including visual perception, audio processing, mobility control, and interaction management. It is equipped with a multi-chip AI 4K vision module capable of facial recognition and motion tracking. One small but revealing detail is the inclusion of a physical privacy cover for the camera — a mechanical solution to concerns that software settings alone may not fully resolve. OlloNi SS1 can actively integrate into family activities, and it can autonomously move closer to capture memorable moments or reposition itself to remain engaged in ongoing interactions.OllobotThe robot supports advanced mobility across multiple indoor surfaces, including wooden floors, ceramic tiles, and low-pile carpets, with slope climbing capability up to 3.5 degrees. Rather than remaining in a fixed location, it can move naturally throughout the home to stay close to household members as daily activities unfold. For example, the OlloNi SS1 may greet family members when they arrive home, follow an older adult from the living room to the kitchen while continuing a conversation, remind a child to take a study break after a prolonged period of inactivity, or notice that someone appears unusually quiet and gently check in. During family activities, it can autonomously move closer to capture memorable moments or reposition itself to remain engaged in ongoing interactions.The robot continues to evolve over time, with over-the-air updates that deliver new features, performance improvements, and AI enhancementsIt also incorporates fall detection with optimized accuracy for safety monitoring scenarios. A 6-microphone array enables omnidirectional voice pickup with an effective voice capture range of up to 5 meters, supporting reliable wake-word detection and far-field interaction.To support continuous companionship, much of the robot’s AI processing takes place directly on the device through its “heart module” architecture, with 16 GB of memory and 64 GB of local storage. This enables the system to retain household memories, recognize familiar faces, and respond with lower latency, making interactions feel more natural even during everyday routines.Because companion robots are expected to remain available throughout the day rather than only during brief interactions, the SS1 is designed for extended operation, offering up to 12 hours of standby time and around 5 hours of active interaction on a single charge. This allows it to accompany users through meals, conversations, playtime, and other daily activities without frequent interruptions. To support engaging interactions, much of the robot’s AI processing takes place directly on the device through its “heart module” architecture.OllobotLike the relationships it is designed to build, the robot continues to evolve over time. Running on Android OS with over-the-air (OTA) updates, the system continuously receives new features, performance improvements, and AI enhancements, allowing its capabilities to grow alongside the household it serves.The robot’s behavioral model also improves over time. Rather than reacting to isolated commands, it attempts to establish a baseline understanding of household routines and individuals. Changes in behavior — prolonged quietness, unusual inactivity, or emotional cues — become triggers for interaction.Presence instead of utilitySeveral features in the OlloNi SS1 illustrate this emphasis on presence and continuity in its interactions.The system can identify different household members, including pets, and adapt responses accordingly. Remote communication features allow family members to connect through the device without treating every interaction like a scheduled call. Environmental sensors support contextual reminders tied to weather or room conditions.Its “2+1” multi-display configuration is also designed around emotional communication. Two circular side displays function as expressive “emotional eyes,” while a separate primary display handles information and structured interaction. The separation allows emotional signaling and functional communication to operate independently, creating more intuitive nonverbal interaction even when no dialogue is taking place. The robot’s behavioral model improves over time. Rather than reacting to isolated commands, it attempts to establish a baseline understanding of household routines and individuals.OllobotThe SS1 also includes an automated life-recording system built on facial recognition and behavioral-event detection that can capture moments such as laughter, physical closeness, or group interaction automatically. An integrated AI vlog engine can then organize those moments into edited short-form videos with automated sequencing and soundtrack generation. The design intent is to preserve spontaneous domestic moments without requiring active documentation behavior from users.An integrated AI vlog engine can organize recorded moments into edited short-form videos with automated sequencing and soundtrack generationVisual data is processed primarily on the device through the SS1’s on-device AI architecture, with household memories stored locally and managed within Ollobot’s proprietary ecosystem instead of being shared with third-party smart home platforms. Access to recordings and live feeds is restricted to authorized users through the companion app, while encrypted communication helps protect data during remote access. Users also retain direct control over recording preferences, and the physical camera privacy cover provides an additional hardware-level safeguard whenever visual monitoring is not desired. Learn more at ollobot.com.Remote communication is similarly structured around persistence rather than transaction. Traditional video calls are episodic and screen-bound; the SS1 instead acts as a continuously present interface embedded inside the household environment. Through autonomous mobility, environmental awareness, and persistent household memory, remote family members interact with an ongoing domestic context.The larger shift to “gentle intelligence”Ultimately, gentle intelligence is not about making robots behave more like humans — it is about helping them fit more naturally into human lives. Each OlloNi SS1 unit develops a unique behavioral profile based on its household. Two units running in different homes for a year will have become meaningfully different from each other, shaped by the specific people, habits, and rhythms of where they live.That kind of long-term personalization is what early companion robots never had. It is also what makes the difference between a product that ends up on a shelf and one that actually earns its place in a home.Learn more at ollobot.com.", "subcategory": "industrial"}, {"title": "Video Friday: Do We Need Superhuman Humanoid Robots?", "url": "https://spectrum.ieee.org/video-friday-unitree-superhuman", "summary": "Video Friday is your weekly selection of awesome robotics videos, collected by your friends at IEEE Spectrum robotics. We also post a weekly calendar of upcomin…", "source": "IEEE Spectrum", "category": "trend", "lang": "en", "title_en": "Video Friday: Do We Need Superhuman Humanoid Robots?", "summary_en": "Video Friday is your weekly selection of awesome robotics videos, collected by your friends at IEEE Spectrum robotics. We also post a weekly calendar of upcomin…", "content_en": "Video Friday is your weekly selection of awesome robotics videos, collected by your friends at IEEE Spectrum robotics. We also post a weekly calendar of upcoming robotics events for the next few months. Please send us your events for inclusion.Humanoids Summit Seoul: 22–23 September 2026, SEOULIROS 2026: 27 September–1 October 2026, PITTSBURGHCoRL 2026: 9–12 November 2026, AUSTINEnjoy today’s videos! This is very, very cool. But I’m trying to think of what the commercial use case will be, you know? I guess, high speed, incredibly dangerous package delivery to second-floor windows or something...?[ Unitree ]Humans have a remarkable ability to perform new physical skills from only one or a few examples. Our latest robot foundation model, GEN-1.5, exhibits the beginnings of that same ability: It can learn a new task in seconds, from a single example, without gradient updates or fine-tuning. It displays broad capabilities across one-shot and few-shots learning from demonstration, as well as zero-shot physical generalization. Although the tasks are simple and short-horizon, this is the first model we know for which one-shot and few-shots learning of physical skills have emerged at scale. We view these results as a significant step toward our mission of building general intelligence for the physical world.I will make the cautionary point that for many of these “the model figured it out” tasks, the blog post can only say that there was no relevant pretraining data “to the best of our knowledge.”[ Generalist ]BeanBot is a robot inspired by Mexican jumping beans, and I need say no more.[ IIT ]As a professional bagpiper who definitely pays very close attention to whatever that annoying tapping noise is coming from the back of the band, I can attest to this group of robot drummers being absolutely top-notch.[ AgileX Robotics ]What does it take for an aerial robot to move through a sequence of arbitrary poses—fast, precisely, and continuously? Rather than teaching the robot a behavior from data, we asked how far a first-principles analytical model could take us. Through a collaboration between the AIMS Group at the Hong Kong Polytechnic University and DRAGON Lab at the University of Tokyo, we developed the first sequential-convex-programming-based trajectory-optimization framework for generalized multirotors, covering both conventional and omnidirectional platforms.[ DRAGON Lab ]Thanks, Moju!This is a nifty idea that adapts a kind of interface frequently used for robot training and uses it for human training instead.[ MIT ]Gravis Robotics brings robotic intelligence to heavy construction machines. Our retrofit kit, the Gravis Rack, turns off-the-shelf hydraulic machines into robots. Cameras, lidar, and onboard compute lets your machine see and understand its surroundings, and learning-based control lets it work close to its limits, moving more dirt with full, fast cycles.[ Gravis Robotics ]Robust brachiation requires precise hand movements to grasp and release bars together with highly coordinated whole-body motion. To address this challenge, we propose a learning-based framework centered on waypoint-guided reinforcement learning (WGRL). WGRL guides the end effector through waypoints while allowing RL to explore and generate dynamic whole-body behaviors. With this approach, the learned policy demonstrated robust brachiation across diverse courses with different bar heights, spacings, and orientations in sim-to-sim experiments. In the real world, our life-size dual-arm robot successfully traversed four consecutive bars.[ EVARL ]Thanks, Ayumu!Well, here’s a different approach to welding in shipyards with robots.[ Kawasaki ]We should have a lot more robots in agriculture, if only they’d lettuce.[ Flexiv ]We’ve all had refs like these.[ PHYBOT ]I got stuck after the first 15 seconds of this video trying to imagine what any of these home humanoids would usefully do if they dropped a glass.[ Zhejiang Humanoid ]Shakey the Robot doesn’t get enough love.[ SRI ]This work introduces a novel approach to physical human-robot interaction (pHRI) by leveraging the joint torque sensors of standard collaborative robots. By mounting a passive, uninstrumented plexiglass touchpad to the robot’s flange, we transform the robot into a handwriting-based input interface.[ TS-Robotics ]", "subcategory": "industrial"}, {"title": "Drones With Claws Perch on Arctic Icebergs", "url": "https://spectrum.ieee.org/arctic-iceberg-drones", "summary": "This article is part of our exclusive IEEE Journal Watch series in partnership with IEEE Xplore.Microspines are one of many ways to enable robots to latch onto …", "source": "IEEE Spectrum", "category": "trend", "lang": "en", "title_en": "Drones With Claws Perch on Arctic Icebergs", "summary_en": "This article is part of our exclusive IEEE Journal Watch series in partnership with IEEE Xplore.Microspines are one of many ways to enable robots to latch onto …", "content_en": "This article is part of our exclusive IEEE Journal Watch series in partnership with IEEE Xplore.Microspines are one of many ways to enable robots to latch onto surfaces like walls and ceilings. Now roboticists in Canada are using the mini spikes to get drones to land on a more challenging, remote surface: icebergs.Like a spider, the Ice Dart can land on and latch onto steep, slippery surfaces such as icebergs and glaciers—an increasingly useful capability as activity in the Arctic increases. The drone can grip onto icy slopes of nearly 60 degrees, which is way beyond what most humans could manage without special equipment. In a recent study, researchers explained how they developed the Ice Dart drone with a special landing gear that absorbs the impact of a hard landing while holding the drone in place with tiny spines that penetrate and grip the ice. Published in IEEE Transactions on Field Robotics, the study describes how the Ice Dart was able to land on icebergs and a glacier in southeast Iceland. Tests took place amid persistent winds and temperatures of 0 to 10 °C along the ruggedly breathtaking Fjallsjökull (pronounced “FYATLS-yuh-kuutl”) glacier, which empties into a lagoon filled with icebergs. The drone was able to successfully perch at speeds of up to 3 meters per second and slopes of up to 58 degrees, with a success rate of 100 percent even in wind speeds of 30 km/h.The researchers were motivated by a desire to allow drones to land almost anywhere in the world, since the availability of safe landing sites is one of the primary limitations on where and how drones can operate. The researchers already have a history of developing drones that can land on fast-moving trucks as well as trailers, boats, and steep roofs. Ice Perching“The ability to land rather than hover can fundamentally change how drones are used in the field,” says Alexis Lussier Desbiens, a professor of engineering at Université de Sherbrooke, in Sherbrooke, Quebec, Canada, who coauthored the study. “Once a drone has landed, energy consumption drops dramatically, allowing much longer observation periods with a small aircraft. The drone also becomes completely silent and can even reduce or eliminate its thermal and RF signature by shutting down major onboard systems.”Landing on icebergs specifically allows drones to monitor them for days or months, producing more detailed observation than a quick aerial surveillance mission. This could simplify iceberg tracking compared to methods such as helicopter deployment, dropped instruments, or dart-like tracking devices, and provide another data layer to satellite and ship-based iceberg detection, according to the researchers. It could also provide a means of monitoring icebergs that are otherwise untrackable.With its carbon-fiber construction, the Ice Dart drone weighs just 2.65 kg and has four legs arranged in an X shape, attached to its body with a pivot joint. Used in the group’s previous drone research, this landing gear disperses energy to reduce impact and overcomes multiple engineering challenges. The friction shock absorbers consist of 38 disks that generate friction torque as the legs move up and down upon impact. This lowers the UAV’s center of mass and helps spread out the kinetic energy of landing, but the real trick comes in the form of two retractable spines on each foot—one for uphill and one for downhill grip. The larger spine engages on the more heavily loaded downhill feet, and the smaller, thinner spine engages more easily on the uphill feet, even under very low loads on steep slopes. The spines only penetrate the ice as the suspension compresses, generating grip and protecting them from high-impact forces. “The inspiration for the retractable spines in the feet came from looking at a cat’s claws and their ability to deploy only when needed,” says Isaac Tunney, a Université de Sherbrooke postdoc in mechanical and robotics engineering who was lead author of the paper. “I wanted to create feet that would naturally and passively engage their spines in the ice at the right moment, regardless of the drone’s orientation, the surface geometry, or the ice conditions.”Arctic SurveillanceWilliam D. Harcourt is a researcher at the University of Aberdeen, in Aberdeen, Scotland, focused on Arctic glaciers, snow, and sea ice, as well as the use of remote sensing and machine learning techniques. Harcourt was not involved in the study, but he sees several potentially interesting applications of the technology. “Near the front of tidewater glaciers, these systems could enable measurement of stress and strain and help us understand calving processes,” Harcourt says. “Drones can be used as a mobile GPS, literally acting as a receiver on the ice, but the system would need to solve tilting issues as 3D change measurements usually required the antenna to be horizontal. However, if these problems can be solved, it could be used to track iceberg movements.”The researchers want to continue developing the Ice Dart technology for real-world applications, including autonomous landing site selection and an emergency takeoff capability to be used if an iceberg rolls over or breaks apart. This August, the drone will be deployed during a Canadian Arctic mission to land on icebergs, collect data, and help validate ship-based iceberg-detection systems.", "subcategory": "industrial"}, {"title": "湖南格瑞普新能源有限公司生产车间发生火灾，5人受伤", "url": "https://www.jiemian.com/article/15042226.html", "summary": "郴州高新技术产业开发区管理委员会通报，9月1日14时40分许，湖南格瑞普新能源有限公司生产车间发生火灾。接报后，高新区、应急、公安、消防、生环、卫健等相关部门立即到达现场处置，火情已得到有效控制，5人受轻伤，已及时送医救治。起火原因正在调查中。", "source": "界面新闻", "category": "trend", "lang": "zh", "subcategory": "industrial"}, {"title": "Is Shipyard Welding the Right First Job for Humanoid Robots?", "url": "https://spectrum.ieee.org/persona-ai-humanoid-robot-welding", "summary": "Humanoids desperately need to stop making YouTube videos and get a job already, and Persona AI is one of the few humanoid companies that seems to be entirely fo…", "source": "IEEE Spectrum", "category": "trend", "lang": "en", "title_en": "Is Shipyard Welding the Right First Job for Humanoid Robots?", "summary_en": "Humanoids desperately need to stop making YouTube videos and get a job already, and Persona AI is one of the few humanoid companies that seems to be entirely fo…", "content_en": "Humanoids desperately need to stop making YouTube videos and get a job already, and Persona AI is one of the few humanoid companies that seems to be entirely focused on making that happen. Persona AI’s approach has been to carefully select a job that is economically viable for robots right now, and they’ve found one that was also the job of one of the very first industrial robots ever sold: welding.IEEE Spectrum first spoke with Persona two years ago, shortly after it was founded by Nicolaus Radford and Jerry Pratt. Radford led the Valkyrie program at NASA’s Johnson Space Center back in the day and was also the founder of Nauticus Robotics, while Pratt led IHMC’s DARPA Robotics Challenge team before spending a couple of years as CTO of Figure. The Challenge of HumanoidsAs of our first conversation in 2024, Persona had committed to building an economically viable humanoid, but they hadn’t yet figured out where their focus was going to be. “We were all over the place,” Radford says. “Warehousing, automotive, we probably even mentioned the home.” These are the same environments with the same sorts of potential applications that basically every other humanoid robotics company is attempting to make economically viable, and despite an ever more exhaustive number of demonstrations, so far none have succeeded at any sort of useful scale. The challenge for Persona, and really for every robotics company, is that it’s not enough that you have a robot that is simply capable of doing a task. It’s also not enough that your robot can do that task in a way that is efficient, reliable, and safe. What’s required is that your robot can make money for both you and your customer. Most humanoid companies seek to achieve this by targeting baseline “unskilled” human labor.Persona did not see economic viability in the unskilled labor approach, Radford says. “We started forming this thesis around skilled trades and tool usage.” Persona is targeting much more expensive skilled labor with its robots, and the reason why this is feasible is because their entry point focuses on the kind of skills that robots are especially good at. “I like to call it ‘last-mover advantage.’ We’ve seen everything that everybody’s doing, and we’ve decided that there’s a different way.” Persona AI/YouTube A Humanoid for Shipyard WeldingThe first task that Persona’s humanoid is focusing on is welding—using a handheld tool to connect one piece of metal to another. “Tool use is pretty difficult,” Pratt says. “And we want to use the same tools that humans do, which makes it more difficult.” That difficulty is offset somewhat by the fact that Persona’s humanoid will first focus on making long, linear welds that are relatively uncomplicated. “This is not the hardest style of weld,” Radford says, “but in shipbuilding you need a lot of them—hundreds of kilometers of linear welds per ship.”Currently, Persona has two public partnerships: one with HD Hyundai, which is the world’s largest shipbuilder, and the other with POSCO, one of the largest steel producers in the world, both in Korea. Persona declined to get into detail, but Radford says that broadly speaking, the company is interested in customers who can support ‘hundreds’ of robots per location.Shipyard welding is an enticing application for Persona because there is a deficit of skilled (and highly paid) workers, it’s taxing physical labor, and it’s a comparatively easy skill for a humanoid to learn.The welding process is skilled in a very robot-friendly way. Because you can only weld as fast as metal melts, the top speed for the task is an easily manageable centimeter per second. And making a high quality weld involves millimeter-scale repeated motions, which robots excel at, especially over long periods of time—whereas humans tend to get tired or bored. Pratt expects that for these uncomplicated welds, performing on par with humans—if not eventually better—will be achievable soon.Shipyards make a compelling case for a humanoid with legs, as opposed to a more stable wheeled base. “These open-air shipyards are a couple hundred meters long, with horizontal and vertical spars that you have to step over all the time,” Radford says. “You’ve got to work on the ground, overhead, and through portholes.” Persona considered other form factors, like four legs (or even more), but determined a two-legged robot would be the least disruptive to existing shipyard rhythms.The Economic Viability of HumanoidsDeploying their robots in shipyards specifically brings additional advantages for Persona. The safety concerns that come with bipedal robots—such as potentially falling over on a human worker—are lessened because a shipyard environment is staffed with workers who are trained to work around potentially dangerous industrial equipment. The company is also less sensitive to competitive pricing because no other company is pursuing the use case. “We’re now in an industry where the value added by our robot can be high enough that we don’t have to cut corners on quality and features in order to reduce the price,” Pratt says. “With a robot for the home, for example, there would be a lot of competition and a ton of price pressure.”The added value for shipbuilders, Radford explains, doesn’t come from replacing humans with robots. “Our current partnerships are running at a significant backlog, and they’re labor-constrained. So we want to help our customers’ top line, not necessarily their bottom line.” In other words, rather than trying to argue that their robots will lower shipbuilding costs, Persona is instead arguing that their robots will allow more ships to be built. “Even if our robot was more expensive than a human, that would still be valuable to these companies, because it could unlock additional revenue,” Radford says. And when the additional skilled labor does not exist, Persona’s robots could be the next-best option for shipbuilders who need to scale. Shipyards are environments where legs are necessary for a robot to be useful.CFOTO/Future Publishing/Getty ImagesPersona’s Multipurpose FutureIn the current commercial humanoid climate, where the emphasis seems to be on developing a “general purpose” robot (whatever that means) that will somehow justify itself through some undefined scale in some equally undefined and perpetually receding future, Persona stands out with their focus on a seemingly viable, near-term, and very specific business case. It hasn’t been easy, though. “It hurts us a little bit,” Radford says. “We’ve been told that we’re not thinking big enough.” But a t
